<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pengolah Jadwal Prodi Akuntansi</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#111827}.header{background:#111827;color:white;padding:34px 20px;text-align:center}.header h1{margin:0 0 8px;font-size:34px}.header p{margin:0;color:#cbd5e1}.container{max-width:1600px;margin:24px auto;padding:0 18px}.card{background:white;border-radius:18px;padding:24px;margin-bottom:24px;box-shadow:0 5px 20px rgba(0,0,0,.07)}h2{margin-top:0}label{display:block;font-weight:bold;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}select,input[type=file]{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;background:white;font-size:16px}button{border:0;border-radius:10px;padding:15px 20px;font-size:17px;font-weight:bold;cursor:pointer;background:#111827;color:white}button:disabled{opacity:.45;cursor:not-allowed}.download{background:#166534}.actions{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.success,.error,.info{padding:14px;border-radius:10px;margin-top:16px}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.info{background:#eff6ff;color:#1e40af}.hint{color:#64748b;margin-top:9px}.summary{font-weight:bold;font-size:22px;margin:8px 0 18px}.table-card{background:white;padding:24px;margin-bottom:28px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.07);overflow-x:auto}.title{text-align:center;font-size:28px;font-weight:bold;margin-bottom:6px}.subtitle{text-align:center;color:#64748b;margin-bottom:20px}table{width:100%;border-collapse:collapse;min-width:1150px}th{background:#111827;color:#fff;padding:14px 10px;text-align:center;white-space:nowrap}td{padding:12px 10px;border:1px solid #d1d5db;vertical-align:top}.center{text-align:center}.empty{padding:25px;text-align:center;color:#64748b}.badge{display:inline-block;background:#e2e8f0;padding:4px 9px;border-radius:999px;font-size:13px;font-weight:bold}.footer-note{color:#64748b;font-size:14px;margin-top:10px}@media(max-width:900px){.grid,.actions{grid-template-columns:1fr}.header h1{font-size:27px}}
</style>
</head>
<body>
<div class="header"><h1>Pengolah Jadwal Prodi Akuntansi</h1><p>1 kelas = 1 tabel • Semester otomatis dari kode kelas • Download Excel per reguler</p></div>
<div class="container">
<div class="card">
<h2>1. Upload File Excel</h2>
<input type="file" id="file" accept=".xlsx,.xls">
<div id="fileStatus"></div>
<div class="hint">File dibaca langsung di browser. Struktur mengikuti sheet <b>Reg A</b>, <b>Reg B</b>, dan <b>Reg CS</b>.</div>
</div>
<div class="card">
<h2>2. Pilih Tampilan</h2>
<div class="grid">
<div><label>Reguler</label><select id="reg" disabled><option value="">Upload Excel terlebih dahulu</option></select></div>
<div><label>Mode Tampilan</label><select id="mode" disabled><option value="single">Satu kelas</option><option value="all">Semua kelas</option></select></div>
<div><label>Kode Kelas</label><select id="kelas" disabled><option value="">Pilih kode kelas</option></select></div>
</div>
<div class="actions"><button id="show" disabled>Tampilkan Jadwal</button><button id="download" class="download" disabled>Download Excel</button></div>
<div id="status"></div>
</div>
<div id="hasil"></div>
</div>
<script>
let wb=null, classes=[], shown=[];
const fileEl=document.getElementById('file'),fileStatus=document.getElementById('fileStatus'),regEl=document.getElementById('reg'),modeEl=document.getElementById('mode'),kelasEl=document.getElementById('kelas'),showEl=document.getElementById('show'),downloadEl=document.getElementById('download'),statusEl=document.getElementById('status'),hasilEl=document.getElementById('hasil');
const CFG={
 A:{sheet:'Reg A',header:5,blocks:[[7,16,'Senin'],[17,26,'Selasa'],[27,36,'Rabu'],[37,46,'Kamis'],[47,56,"Jum'at"]],time:{1:'07.10 - 08.50',2:'08.50 - 10.30',3:'10.30 - 12.10',4:'13.00 - 14.40',5:'14.40 - 16.30'}},
 B:{sheet:'Reg B',header:4,blocks:[[6,13,'Senin'],[14,21,'Selasa'],[22,29,'Rabu'],[30,37,'Kamis'],[38,41,"Jum'at"]],time:{1:'07.10 - 08.50',2:'08.50 - 10.30',3:'10.30 - 12.10',4:'13.00 - 14.40',5:'14.40 - 16.30'}},
 CS:{sheet:'Reg CS',header:2,blocks:[[4,12,'CS (K1)'],[14,22,'CS (K2)']],time:{1:'07.40 - 09.20',2:'09.20 - 11.00',3:'11.00 - 13.50',4:'13.50 - 15.30',5:''}}
};
function clean(v){return v==null?'':String(v).replace(/\s+/g,' ').trim()}
function esc(v){return clean(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function normCode(v){return clean(v).replace(/\s+/g,'').toUpperCase()}
function semester(code){const m=normCode(code).match(/^(\d{2})/);return m?String(parseInt(m[1],10)):''}
function validCode(v,reg){const x=normCode(v); if(reg==='A') return /^\d{2}AKSP[A-Z0-9]{2,4}(?:\([^)]*\))?$/.test(x); if(reg==='B') return /^\d{2}AKSM[A-Z0-9]{2,4}(?:\([^)]*\))?$/.test(x); return /^\d{2}AKSE[A-Z0-9]{2,4}(?:\([^)]*\))?$/.test(x)}
function findClasses(ws,reg){
  const cfg=CFG[reg],out=[];
  if(!ws || !ws['!ref']) return out;
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let c=range.s.c+1;c<=range.e.c+1;c++){
    const v=value(ws,cfg.header,c);
    if(validCode(v,reg)) out.push({reg,code:normCode(v),col:c});
  }
  return out;
}
function value(ws,r,c){
  const cell=ws[XLSX.utils.encode_cell({r:r-1,c:c-1})];
  return cell?clean(cell.v):'';
}
function room(ws,r,c,reg){
  const cfg=CFG[reg];
  const headerBelow=value(ws,cfg.header+1,c+1).toUpperCase();
  if(headerBelow==='RUANGAN'||headerBelow==='RUANG') return value(ws,r,c+1);
  return '';
}
function parseClass(ws,info,reg){const cfg=CFG[reg],data=[];let no=1; for(const [start,end,day] of cfg.blocks){for(let r=start;r<=end;r++){const jam=value(ws,r,3); if(!/^\d+(?:\.0+)?$/.test(jam)) continue; const j=parseInt(jam,10); const teacher=value(ws,r,info.col); const course=value(ws,r+1,info.col); if(course){data.push({semester:semester(info.code),no:no++,mataKuliah:course,sks:'',ruang:room(ws,r,info.col,reg),hari:day,jamKe:j,waktu:cfg.time[j]||'',dosen:teacher})}}} return {reg,code:info.code,semester:semester(info.code),data}}
function parseAll(){const arr=[];for(const reg of ['A','B','CS']){const cfg=CFG[reg],ws=wb.Sheets[cfg.sheet];if(!ws)continue;findClasses(ws,reg).forEach(info=>arr.push(parseClass(ws,info,reg)))}return arr}
function regName(r){return r==='A'?'REGULER A':r==='B'?'REGULER B':'REGULER C / CS'}
function fillKelas(){const reg=regEl.value,list=reg==='ALL'?classes:classes.filter(x=>x.reg===reg);kelasEl.innerHTML='<option value="">Pilih kode kelas</option>';list.forEach(x=>{const o=document.createElement('option');o.value=x.reg+'|'+x.code;o.textContent=x.code;kelasEl.appendChild(o)});kelasEl.disabled=modeEl.value==='single'&&list.length===0;showEl.disabled=list.length===0;}
function tableHTML(cls){let h='<div class="table-card"><div class="title">'+esc(regName(cls.reg))+' '+esc(cls.code)+'</div><div class="subtitle">Semester <b>'+esc(cls.semester)+'</b> • '+cls.data.length+' mata kuliah</div>';if(!cls.data.length)return h+'<div class="empty">Belum ada mata kuliah yang terisi untuk kelas ini pada data Excel.</div></div>';h+='<table><thead><tr><th>SEMESTER</th><th>NO</th><th>MATA KULIAH</th><th>SKS</th><th>RUANG</th><th>HARI / KETERANGAN</th><th>JAM KE</th><th>WAKTU</th><th>DOSEN PENGAMPU</th></tr></thead><tbody>';cls.data.forEach(r=>{h+='<tr><td class="center">'+esc(r.semester)+'</td><td class="center">'+esc(r.no)+'</td><td>'+esc(r.mataKuliah)+'</td><td class="center">'+esc(r.sks)+'</td><td>'+esc(r.ruang)+'</td><td>'+esc(r.hari)+'</td><td class="center">'+esc(r.jamKe)+'</td><td>'+esc(r.waktu)+'</td><td>'+esc(r.dosen)+'</td></tr>'});return h+'</tbody></table></div>'}
function show(){const reg=regEl.value,mode=modeEl.value,key=kelasEl.value;if(mode==='single'&&!key){statusEl.innerHTML='<div class="error">Pilih kode kelas dulu.</div>';return}shown=mode==='single'?classes.filter(x=>(x.reg+'|'+x.code)===key):(reg==='ALL'?classes:classes.filter(x=>x.reg===reg));if(!shown.length){statusEl.innerHTML='<div class="error">Data tidak ditemukan.</div>';hasilEl.innerHTML='';downloadEl.disabled=true;return}const total=shown.reduce((n,x)=>n+x.data.length,0);statusEl.innerHTML='<div class="success"><b>'+shown.length+' kelas</b> ditampilkan sebagai <b>'+shown.length+' tabel terpisah</b>. Total <b>'+total+'</b> mata kuliah terbaca.</div>';hasilEl.innerHTML='<div class="summary">Hasil Jadwal</div>'+shown.map(tableHTML).join('');downloadEl.disabled=false;window.scrollTo({top:hasilEl.offsetTop-20,behavior:'smooth'})}
function safeSheetName(name,used){let base=name.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31).trim()||'Kelas',out=base,n=2;while(used.has(out)){const s=' ('+n+++')';out=base.slice(0,31-s.length)+s}used.add(out);return out}
async function download(){
  if(!shown.length)return;
  if(typeof ExcelJS==='undefined'){
    statusEl.innerHTML='<div class="error">Library Excel belum termuat. Refresh halaman lalu coba lagi.</div>';
    return;
  }

  downloadEl.disabled=true;
  downloadEl.textContent='Membuat Excel...';

  try{
    const out=new ExcelJS.Workbook();
    out.creator='Pengolah Jadwal Prodi Akuntansi';
    out.subject='Jadwal Perkuliahan';
    out.title='Jadwal Prodi Akuntansi';
    out.company='Prodi Akuntansi';
    out.created=new Date();

    const groups={A:[],B:[],CS:[]};
    shown.forEach(cls=>{if(groups[cls.reg])groups[cls.reg].push(cls)});

    const headers=['SEMESTER','NO','MATA KULIAH','SKS','RUANG','HARI / KETERANGAN','JAM KE','WAKTU','DOSEN PENGAMPU'];
    const widths=[12,7,35,8,16,22,9,20,30];
    const headerFill='111827';
    const titleFill='E2E8F0';
    const borderColor='CBD5E1';

    function applyBorder(cell){
      cell.border={
        top:{style:'thin',color:{argb:borderColor}},
        left:{style:'thin',color:{argb:borderColor}},
        bottom:{style:'thin',color:{argb:borderColor}},
        right:{style:'thin',color:{argb:borderColor}}
      };
    }

    for(const reg of ['A','B','CS']){
      const list=groups[reg];
      if(!list.length)continue;

      const ws=out.addWorksheet(reg==='A'?'Reg A':reg==='B'?'Reg B':'Reg C-CS');
      ws.views=[{showGridLines:false}];
      ws.freezePanes={ySplit:3};
      ws.pageSetup={orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:ws.PAPERSIZE_A4};
      ws.pageSetup.margins={left:0.25,right:0.25,top:0.5,bottom:0.5,header:0.2,footer:0.2};
      widths.forEach((w,i)=>ws.getColumn(i+1).width=w);

      let row=1;
      list.forEach((cls,index)=>{
        // Judul kelas
        ws.mergeCells(row,1,row,9);
        const title=ws.getCell(row,1);
        title.value=regName(cls.reg)+' '+cls.code;
        title.font={name:'Arial',size:16,bold:true,color:{argb:'111827'}};
        title.alignment={horizontal:'center',vertical:'middle'};
        title.fill={type:'pattern',pattern:'solid',fgColor:{argb:titleFill}};
        title.border={
          top:{style:'medium',color:{argb:headerFill}},
          left:{style:'medium',color:{argb:headerFill}},
          bottom:{style:'medium',color:{argb:headerFill}},
          right:{style:'medium',color:{argb:headerFill}}
        };
        ws.getRow(row).height=28;
        row++;

        // Keterangan semester
        ws.mergeCells(row,1,row,9);
        const sub=ws.getCell(row,1);
        sub.value='Semester '+cls.semester+'  •  '+cls.data.length+' mata kuliah';
        sub.font={name:'Arial',size:10,italic:true,color:{argb:'64748B'}};
        sub.alignment={horizontal:'center',vertical:'middle'};
        ws.getRow(row).height=20;
        row++;

        // Header tabel
        const headerRow=ws.getRow(row);
        headerRow.values=headers;
        headerRow.height=28;
        headerRow.eachCell((cell)=>{
          cell.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFF'}};
          cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:headerFill}};
          cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
          applyBorder(cell);
        });
        const tableStart=row;
        row++;

        // Data
        if(cls.data.length){
          cls.data.forEach(r=>{
            const rr=ws.getRow(row);
            rr.values=[r.semester,r.no,r.mataKuliah,r.sks,r.ruang,r.hari,r.jamKe,r.waktu,r.dosen];
            rr.height=23;
            rr.eachCell((cell,col)=>{
              cell.font={name:'Arial',size:10};
              cell.alignment={horizontal:(col===1||col===2||col===4||col===7)?'center':'left',vertical:'middle',wrapText:true};
              applyBorder(cell);
            });
            row++;
          });
        }

        const dataEnd=row-1;
        // PENTING: ExcelJS tidak mengizinkan Table tanpa baris data.
        // Jadi addTable HANYA dipanggil jika kelas memang punya mata kuliah.
        if(cls.data.length>0){
          const tableName='T_'+reg+'_'+String(cls.code).replace(/[^A-Za-z0-9_]/g,'_')+'_'+index;
          ws.addTable({
            name:tableName,
            ref:'A'+tableStart+':I'+dataEnd,
            headerRow:true,
            totalsRow:false,
            style:{theme:'TableStyleMedium2',showFirstColumn:false,showLastColumn:false,showRowStripes:true,showColumnStripes:false},
            columns:headers.map(name=>({name})),
            rows:cls.data.map(r=>[
              r.semester,
              r.no,
              r.mataKuliah,
              r.sks,
              r.ruang,
              r.hari,
              r.jamKe,
              r.waktu,
              r.dosen
            ])
          });
        } else {
          // Kelas kosong tetap ditampilkan di Excel, tetapi bukan Table Excel.
          const note=ws.getCell(row,1);
          ws.mergeCells(row,1,row,9);
          note.value='Belum ada data mata kuliah untuk kelas ini pada file Excel sumber.';
          note.font={name:'Arial',size:10,italic:true,color:{argb:'64748B'}};
          note.alignment={horizontal:'center',vertical:'middle'};
          note.fill={type:'pattern',pattern:'solid',fgColor:{argb:'F8FAFC'}};
          row++;
        }

        // Jarak antar tabel kelas
        row+=2;
      });

      // Print area sampai baris terakhir
      ws.autoFilter=null;
      ws.pageSetup.printArea='A1:I'+Math.max(1,row-1);
    }

    const buffer=await out.xlsx.writeBuffer();
    const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='Jadwal_Prodi_Akuntansi_Rapi.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);

    statusEl.innerHTML='<div class="success"><b>Excel berhasil dibuat!</b> Reg A, Reg B, dan Reg C/CS masing-masing menjadi sheet sendiri. Setiap kelas dibuat sebagai tabel Excel terpisah, lengkap dengan judul bold, header, border, filter, lebar kolom, dan format siap cetak. Kelas tanpa data tetap ditampilkan sebagai catatan dan tidak dibuat sebagai Table Excel agar proses tidak error.</div>';
  }catch(err){
    console.error(err);
    statusEl.innerHTML='<div class="error">Gagal membuat Excel: '+esc(err.message||err)+'</div>';
  }finally{
    downloadEl.disabled=false;
    downloadEl.textContent='Download Excel';
  }
}
fileEl.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;fileStatus.innerHTML='<div class="info">Sedang membaca Excel...</div>';const reader=new FileReader();reader.onload=ev=>{try{wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});classes=parseAll();regEl.innerHTML='<option value="ALL">Semua Reguler</option><option value="A">Reg A</option><option value="B">Reg B</option><option value="CS">Reg C / CS</option>';regEl.disabled=false;modeEl.disabled=false;modeEl.value='all';regEl.value='ALL';fillKelas();const a=classes.filter(x=>x.reg==='A').length,b=classes.filter(x=>x.reg==='B').length,c=classes.filter(x=>x.reg==='CS').length;fileStatus.innerHTML='<div class="success">File berhasil dibaca. Terdeteksi <b>'+classes.length+' kelas</b>: Reg A <b>'+a+'</b>, Reg B <b>'+b+'</b>, Reg C/CS <b>'+c+'</b>.</div>';statusEl.innerHTML='<div class="info">Pilih reguler dan mode tampilan, lalu klik <b>Tampilkan Jadwal</b>.</div>'}catch(err){console.error(err);fileStatus.innerHTML='<div class="error">Excel gagal dibaca: '+esc(err.message)+'</div>'}};reader.readAsArrayBuffer(f)});
regEl.addEventListener('change',fillKelas);modeEl.addEventListener('change',()=>{fillKelas();});showEl.addEventListener('click',show);downloadEl.addEventListener('click',download);
</script>
</body></html>
