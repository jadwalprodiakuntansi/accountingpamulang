<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengolah Jadwal Prodi Akuntansi</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#111827}.header{background:#111827;color:#fff;text-align:center;padding:35px 20px}.header h1{margin:0;font-size:34px}.header p{margin:10px 0 0;color:#d1d5db;font-size:18px}.container{max-width:1500px;margin:35px auto;padding:0 20px}.card{background:#fff;padding:28px;margin-bottom:25px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08)}h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:700;margin-bottom:8px}input,select,button{width:100%;padding:14px;border-radius:10px;border:1px solid #d1d5db;font-size:16px}button{background:#111827;color:#fff;font-weight:700;cursor:pointer;border:0}button:hover{background:#1f2937}.button-row{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}.success{background:#dcfce7;color:#166534;padding:14px;border-radius:10px;margin-top:18px}.error{background:#fee2e2;color:#991b1b;padding:14px;border-radius:10px;margin-top:18px}.info{background:#e0f2fe;color:#075985;padding:14px;border-radius:10px;margin-top:18px}.table-card{overflow:auto}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px;flex-wrap:wrap}.toolbar h2{margin:0}.small{color:#6b7280}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1150px}th{background:#111827;color:#fff;padding:13px;text-align:center;position:sticky;top:0}td{padding:11px;border:1px solid #d1d5db;vertical-align:top}td.center{text-align:center}.reg-badge{font-weight:700;white-space:nowrap}.empty{padding:35px;text-align:center;color:#6b7280}.download{background:#166534}.download:hover{background:#14532d}.danger{background:#991b1b}.danger:hover{background:#7f1d1d}@media(max-width:800px){.grid,.button-row{grid-template-columns:1fr}.header h1{font-size:25px}}
</style>
</head>
<body>
<div class="header">
  <h1>Pengolah Jadwal Prodi Akuntansi</h1>
  <p>Upload Excel → pilih Reg/Kelas → tampilkan jadwal → download Excel</p>
</div>

<div class="container">
  <div class="card">
    <h2>1. Upload File Excel</h2>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
    <div id="fileStatus"></div>
  </div>

  <div class="card">
    <h2>2. Pilih Data</h2>
    <div class="grid">
      <div>
        <label>Reguler</label>
        <select id="regSelect" disabled>
          <option value="">Upload Excel terlebih dahulu</option>
        </select>
      </div>
      <div>
        <label>Kode Kelas</label>
        <select id="classSelect" disabled>
          <option value="">Pilih reguler terlebih dahulu</option>
        </select>
      </div>
    </div>
    <div class="button-row">
      <button id="showButton" disabled>Tampilkan Jadwal</button>
      <button id="downloadButton" class="download" disabled>Download Excel</button>
    </div>
    <div id="classStatus"></div>
  </div>

  <div id="result"></div>
</div>

<script>
let workbook = null;
let allRecords = [];
let displayedRecords = [];

const excelFile = document.getElementById('excelFile');
const fileStatus = document.getElementById('fileStatus');
const regSelect = document.getElementById('regSelect');
const classSelect = document.getElementById('classSelect');
const showButton = document.getElementById('showButton');
const downloadButton = document.getElementById('downloadButton');
const classStatus = document.getElementById('classStatus');
const result = document.getElementById('result');

function clean(v){
  if(v===null || v===undefined) return '';
  return String(v).replace(/\s+/g,' ').trim();
}

function escapeHtml(v){
  return clean(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function normalizeCode(v){
  return clean(v).replace(/\s+/g,' ');
}

function isClassCode(v){
  const s=normalizeCode(v).toUpperCase();
  return /AKS[A-Z]/.test(s) && /\d/.test(s);
}

function regFromSheet(sheet){
  const s=sheet.toLowerCase();
  if(s==='reg a') return 'Reg A';
  if(s==='reg b') return 'Reg B';
  if(s==='reg cs' || s==='reg c') return 'Reg C';
  return null;
}

function headerIsRoom(data,col){
  for(let r=0;r<Math.min(data.length,10);r++){
    const v=clean(data[r]?.[col]);
    if(/^ruangan?$|^ruang$/i.test(v)) return true;
  }
  return false;
}

function getClassColumns(data){
  const cols=[];
  const seen=new Set();
  for(let r=0;r<Math.min(data.length,12);r++){
    for(let c=0;c<(data[r]?.length||0);c++){
      const value=data[r][c];
      if(isClassCode(value)){
        const code=normalizeCode(value);
        const key=code.toUpperCase();
        if(!seen.has(key)){
          seen.add(key);
          cols.push({col:c,code,roomCol:headerIsRoom(data,c+1)?c+1:null});
        }
      }
    }
  }
  return cols;
}

function findDayMarkers(data){
  const markers=[];
  const dayWords=/^(senin|selasa|rabu|kamis|jum'?at|sabtu|minggu)$/i;
  for(let r=0;r<data.length;r++){
    for(let c=0;c<Math.min(3,data[r]?.length||0);c++){
      const v=clean(data[r][c]);
      if(dayWords.test(v)) markers.push({row:r,day:v});
    }
  }
  return markers;
}

function findRegCMarkers(data){
  // Sheet Reg CS memakai label seperti "CS (K1)" / "CS (K2)" di kolom HARI.
  const markers=[];
  for(let r=0;r<data.length;r++){
    const v=clean(data[r]?.[1]);
    if(/^CS\s*\(/i.test(v)) markers.push({row:r,day:v});
  }
  return markers;
}

function getTimeMap(data){
  const map={};
  const timeRe=/\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}/;
  for(const row of data){
    for(let c=0;c<row.length;c++){
      const v=clean(row[c]);
      const m=v.match(timeRe);
      if(m){
        // Cari nomor jam pada 3 kolom sebelum/sekitar sel waktu.
        let jam='';
        for(let k=Math.max(0,c-3);k<=c;k++){
          const x=clean(row[k]);
          if(/^\d+(\.0)?$/.test(x)) jam=String(parseInt(x,10));
        }
        if(jam) map[jam]=m[0].replace(/\s+/g,' ');
      }
    }
  }
  return map;
}

function getSlotRows(data){
  const rows=[];
  for(let r=0;r<data.length;r++){
    const v=clean(data[r]?.[2]);
    if(/^\d+(\.0)?$/.test(v)){
      const n=parseInt(v,10);
      if(n>=1 && n<=10) rows.push({row:r,slot:n});
    }
  }
  return rows;
}

function assignDayForBlocks(data,slotRows,reg){
  const result=[];
  const markers=reg==='Reg C' ? findRegCMarkers(data) : findDayMarkers(data);
  // Cari setiap baris slot 1 sebagai awal blok hari/kelompok.
  const starts=slotRows.filter(x=>x.slot===1).map(x=>x.row);
  for(let i=0;i<starts.length;i++){
    const start=starts[i];
    const end=i+1<starts.length?starts[i+1]-1:data.length-1;
    let day='';
    const inside=markers.filter(m=>m.row>=start && m.row<=end);
    if(inside.length) day=inside[0].day;
    // Jika marker ada tepat sebelum start, pakai marker terdekat.
    if(!day){
      const before=markers.filter(m=>m.row<start).sort((a,b)=>b.row-a.row)[0];
      if(before) day=before.day;
    }
    for(const s of slotRows.filter(x=>x.row>=start && x.row<=end)){
      result.push({...s,day});
    }
  }
  return result;
}

function extractSheet(sheet,reg){
  const ws=workbook.Sheets[sheet];
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
  const classCols=getClassColumns(data);
  if(!classCols.length) return [];

  const slotRows=getSlotRows(data);
  const blocks=assignDayForBlocks(data,slotRows,reg);
  const timeMap=getTimeMap(data);
  const records=[];

  for(const cls of classCols){
    for(const block of blocks){
      const r=block.row;
      const teacher=clean(data[r]?.[cls.col]);
      const subject=clean(data[r+1]?.[cls.col]);
      const room=cls.roomCol!==null ? clean(data[r]?.[cls.roomCol]) : '';
      if(!teacher && !subject && !room) continue;

      // Baris yang hanya berisi catatan/jam jangan dimasukkan sebagai mata kuliah.
      if(!subject || /^\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}$/.test(subject)) continue;

      records.push({
        reg,
        sheet,
        kodeKelas:cls.code,
        no:records.filter(x=>x.reg===reg && x.kodeKelas===cls.code).length+1,
        mataKuliah:subject,
        sks:'',
        ruang:room,
        hari:block.day,
        jamKe:block.slot,
        waktu:timeMap[String(block.slot)] || '',
        dosen:teacher
      });
    }
  }
  return records;
}

function loadAllData(){
  allRecords=[];
  for(const sheet of workbook.SheetNames){
    const reg=regFromSheet(sheet);
    if(!reg) continue;
    allRecords.push(...extractSheet(sheet,reg));
  }

  // Hilangkan duplikat persis yang mungkin muncul karena format workbook.
  const seen=new Set();
  allRecords=allRecords.filter(x=>{
    const key=[x.reg,x.kodeKelas,x.hari,x.jamKe,x.mataKuliah,x.dosen,x.ruang].join('|').toUpperCase();
    if(seen.has(key)) return false;
    seen.add(key); return true;
  });

  populateReg();
}

function populateReg(){
  const regs=['ALL','Reg A','Reg B','Reg C'];
  regSelect.innerHTML='';
  const labels={ALL:'Semua Reg (A + B + C)','Reg A':'Reg A','Reg B':'Reg B','Reg C':'Reg C'};
  regs.forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=labels[v]; regSelect.appendChild(o);
  });
  regSelect.disabled=false;
  populateClasses();
}

function populateClasses(){
  const reg=regSelect.value;
  let records=reg==='ALL'?allRecords:allRecords.filter(x=>x.reg===reg);
  const codes=[...new Map(records.map(x=>[x.kodeKelas,x.kodeKelas])).values()];
  codes.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
  classSelect.innerHTML='<option value="ALL">Semua Kelas</option>';
  codes.forEach(code=>{
    const o=document.createElement('option'); o.value=code; o.textContent=code; classSelect.appendChild(o);
  });
  classSelect.disabled=false;
  classStatus.innerHTML=`<div class="info">${codes.length} kode kelas tersedia.</div>`;
  result.innerHTML='';
  downloadButton.disabled=true;
}

function sortRecords(records){
  return [...records].sort((a,b)=>{
    const regOrder={'Reg A':1,'Reg B':2,'Reg C':3};
    return (regOrder[a.reg]||9)-(regOrder[b.reg]||9) ||
      a.kodeKelas.localeCompare(b.kodeKelas,undefined,{numeric:true,sensitivity:'base'}) ||
      a.hari.localeCompare(b.hari) || a.jamKe-b.jamKe;
  });
}

function display(records){
  displayedRecords=sortRecords(records);
  if(!displayedRecords.length){
    result.innerHTML='<div class="card empty">Tidak ada data jadwal untuk pilihan tersebut.</div>';
    downloadButton.disabled=true;
    return;
  }

  const title=(regSelect.value==='ALL'?'SEMUA REG':regSelect.value.toUpperCase()) +
    (classSelect.value==='ALL'?' — SEMUA KELAS':' — '+classSelect.value);

  let html=`<div class="card table-card"><div class="toolbar"><div><h2>${escapeHtml(title)}</h2><div class="small">${displayedRecords.length} baris jadwal ditemukan.</div></div></div><div class="table-wrap"><table><thead><tr>
    <th>REG</th><th>KODE KELAS</th><th>NO</th><th>MATA KULIAH</th><th>SKS</th><th>RUANG</th><th>HARI / KETERANGAN</th><th>JAM KE</th><th>WAKTU</th><th>DOSEN PENGAMPU</th>
  </tr></thead><tbody>`;

  const counters={};
  displayedRecords.forEach(row=>{
    const key=row.reg+'|'+row.kodeKelas;
    counters[key]=(counters[key]||0)+1;
    html+=`<tr><td class="center reg-badge">${escapeHtml(row.reg)}</td><td class="reg-badge">${escapeHtml(row.kodeKelas)}</td><td class="center">${counters[key]}</td><td>${escapeHtml(row.mataKuliah)}</td><td class="center">${escapeHtml(row.sks)}</td><td>${escapeHtml(row.ruang)}</td><td>${escapeHtml(row.hari)}</td><td class="center">${escapeHtml(row.jamKe)}</td><td>${escapeHtml(row.waktu)}</td><td>${escapeHtml(row.dosen)}</td></tr>`;
  });
  html+='</tbody></table></div></div>';
  result.innerHTML=html;
  downloadButton.disabled=false;
}

excelFile.addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file) return;
  fileStatus.innerHTML='<div class="info">Sedang membaca file Excel...</div>';
  const reader=new FileReader();
  reader.onload=function(event){
    try{
      workbook=XLSX.read(new Uint8Array(event.target.result),{type:'array',cellDates:true});
      loadAllData();
      const sheets=workbook.SheetNames.filter(s=>regFromSheet(s));
      fileStatus.innerHTML=`<div class="success">File berhasil dibaca. Sheet jadwal: ${sheets.join(', ')}. Total ${allRecords.length} baris jadwal terdeteksi.</div>`;
      showButton.disabled=false;
    }catch(err){
      console.error(err);
      fileStatus.innerHTML='<div class="error">File Excel gagal dibaca. Coba upload ulang file .xlsx.</div>';
    }
  };
  reader.readAsArrayBuffer(file);
});

regSelect.addEventListener('change',populateClasses);
showButton.addEventListener('click',function(){
  const reg=regSelect.value;
  const code=classSelect.value;
  let records=reg==='ALL'?allRecords:allRecords.filter(x=>x.reg===reg);
  if(code!=='ALL') records=records.filter(x=>x.kodeKelas===code);
  display(records);
});

downloadButton.addEventListener('click',function(){
  if(!displayedRecords.length) return;
  const rows=displayedRecords.map((x,i)=>({
    'REG':x.reg,
    'KODE KELAS':x.kodeKelas,
    'NO':i+1,
    'MATA KULIAH':x.mataKuliah,
    'SKS':x.sks,
    'RUANG':x.ruang,
    'HARI / KETERANGAN':x.hari,
    'JAM KE':x.jamKe,
    'WAKTU':x.waktu,
    'DOSEN PENGAMPU':x.dosen
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:10},{wch:20},{wch:7},{wch:32},{wch:8},{wch:15},{wch:20},{wch:9},{wch:18},{wch:28}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Jadwal');
  const safe=(regSelect.value==='ALL'?'SEMUA_REG':regSelect.value.replace(/\s+/g,'_'))+'_'+(classSelect.value==='ALL'?'SEMUA_KELAS':classSelect.value.replace(/[^A-Za-z0-9_-]/g,''));
  XLSX.writeFile(wb,'Jadwal_'+safe+'.xlsx');
});
</script>
</body>
</html>
