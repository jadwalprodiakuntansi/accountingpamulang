<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengolah Jadwal Prodi Akuntansi</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#111827}
.header{background:#111827;color:#fff;text-align:center;padding:34px 20px}
.header h1{margin:0;font-size:34px}.header p{margin:10px 0 0;color:#d1d5db;font-size:18px}
.container{max-width:1600px;margin:30px auto;padding:0 20px}
.card{background:#fff;padding:28px;margin-bottom:24px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
h2{margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
label{display:block;font-weight:bold;margin-bottom:8px}
input[type=file],select,button{width:100%;padding:14px;border-radius:10px;border:1px solid #d1d5db;font-size:16px}
button{background:#111827;color:#fff;font-weight:bold;border:none;cursor:pointer}
button:hover{background:#1f2937}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}
.download{background:#166534}.download:hover{background:#14532d}
.success{background:#dcfce7;color:#166534;padding:14px;border-radius:10px;margin-top:16px}
.error{background:#fee2e2;color:#991b1b;padding:14px;border-radius:10px;margin-top:16px}
.info{background:#eff6ff;color:#1e40af;padding:14px;border-radius:10px;margin-top:16px}
.hint{color:#6b7280;font-size:14px;margin-top:8px}
.summary{font-weight:bold;font-size:18px;margin:8px 0 20px}
.table-card{background:#fff;padding:25px;margin-bottom:28px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08);overflow-x:auto}
.title{text-align:center;font-size:28px;font-weight:bold;margin-bottom:7px}
.subtitle{text-align:center;color:#6b7280;margin-bottom:20px}
table{width:100%;border-collapse:collapse;min-width:1050px}
th{background:#111827;color:#fff;padding:14px 10px;text-align:center}
td{padding:12px 10px;border:1px solid #d1d5db;vertical-align:top}
.center{text-align:center}
@media(max-width:900px){.grid,.actions{grid-template-columns:1fr}.header h1{font-size:26px}}
</style>
</head>
<body>
<div class="header">
  <h1>Pengolah Jadwal Prodi Akuntansi</h1>
  <p>Data mengikuti struktur Excel asli — 1 kelas = 1 tabel</p>
</div>

<div class="container">
  <div class="card">
    <h2>1. Upload File Excel</h2>
    <input type="file" id="file" accept=".xlsx,.xls">
    <div id="fileStatus"></div>
    <div class="hint">Gunakan file PENJADWALAN GANJI 2026/2027. Data dibaca langsung di browser.</div>
  </div>

  <div class="card">
    <h2>2. Pilih Kelas</h2>
    <div class="grid">
      <div>
        <label>Reguler</label>
        <select id="reg" disabled>
          <option value="">Pilih reguler</option>
          <option value="ALL">Semua Reguler</option>
          <option value="A">Reg A</option>
          <option value="B">Reg B</option>
          <option value="CS">Reg C / CS</option>
        </select>
      </div>
      <div>
        <label>Mode Tampilan</label>
        <select id="mode" disabled>
          <option value="single">Satu kelas</option>
          <option value="all">Semua kelas</option>
        </select>
      </div>
      <div>
        <label>Kode Kelas</label>
        <select id="kelas" disabled>
          <option value="">Pilih kode kelas</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="show" disabled>Tampilkan Jadwal</button>
      <button id="download" class="download" disabled>Download Excel</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="hasil"></div>
</div>

<script>
let wb=null;
let classes=[];
let shown=[];

const CONFIG={
  A:{sheet:"Reg A", headerRow:5, start:7, end:56,
     blocks:[
       [7,16,"Senin"],[17,26,"Selasa"],[27,36,"Rabu"],
       [37,46,"Kamis"],[47,56,"Jum'at"]
     ]},
  B:{sheet:"Reg B", headerRow:4, start:6, end:41,
     blocks:[
       [6,13,"SENIN"],[14,21,"SELASA"],[22,29,"RABU"],
       [30,37,"KAMIS"],[38,41,"JUM'AT"]
     ]},
  CS:{sheet:"Reg CS", headerRow:2, start:4, end:23,
     blocks:[
       [4,12,"CS (K1)"],[14,22,"CS (K2)"]
     ]}
};

function clean(v){
  if(v===null || v===undefined) return "";
  return String(v).replace(/\s+/g," ").trim();
}
function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function normCode(v){
  return clean(v).replace(/\s+/g,"").toUpperCase();
}
function semesterFromCode(code){
  const m=normCode(code).match(/^(\d{2})/);
  return m ? parseInt(m[1],10) : "";
}
function baseCode(code){
  return normCode(code).replace(/\([^)]*\)/g,"");
}
function findCodes(ws,row){
  const result=[];
  for(let c=1;c<=ws.max_column;c++){
    const v=clean(ws.cell(row,c).value);
    if(!v) continue;
    const m=v.match(/^(\d{2}\s*AKS[A-Z]+\d{3})(?:\s*(\([^)]*\)))?$/i);
    if(m){
      result.push({
        col:c,
        code:normCode(m[1])+(m[2] ? " "+m[2].trim() : "")
      });
    }
  }
  return result;
}
function getTimeMap(ws){
  const map={};
  const timeRe=/^\s*\d{1,2}\.\d{2}\s*-\s*\d{1,2}\.\d{2}\s*$/;
  for(let r=1;r<=ws.max_row;r++){
    const b=clean(ws.cell(r,2).value).toLowerCase();
    const jam=clean(ws.cell(r,3).value);
    if(b==="jam ke" && jam){
      for(let c=1;c<=ws.max_column;c++){
        const v=clean(ws.cell(r,c).value);
        if(timeRe.test(v)){
          map[String(Number(jam))]=v;
          break;
        }
      }
    }
  }
  return map;
}
function roomFor(ws,col,r){
  // Ruangan hanya diambil jika kolom di sebelah kode memang merupakan
  // kolom Ruangan. Ini mencegah kode kelas sebelahnya terbaca sebagai ruang.
  const next=col+1;
  if(next>ws.max_column) return "";
  const header=clean(ws.cell(
    CONFIG_BY_SHEET[ws.title]?.headerRow || 1,next
  ).value).toLowerCase();
  // Format utama: kolom setelah DOSEN/MATAKULIAH adalah Ruangan.
  if(header==="ruangan" || header==="ruang"){
    return clean(ws.cell(r,next).value) || clean(ws.cell(r+1,next).value);
  }
  return "";
}
const CONFIG_BY_SHEET={
  "Reg A":CONFIG.A,"Reg B":CONFIG.B,"Reg CS":CONFIG.CS
};

function parseClass(ws, cfg, info, reg){
  const rows=[];
  const times=getTimeMap(ws);
  let no=1;

  // Reg A dan Reg B: setiap slot = 2 baris:
  // baris atas = DOSEN, baris bawah = MATA KULIAH.
  // Reg CS mempunyai pola yang sama.
  for(const block of cfg.blocks){
    const [start,end,label]=block;
    let jam=1;
    for(let r=start;r<=end;r+=2){
      const teacher=clean(ws.cell(r,info.col).value);
      const course=clean(ws.cell(r+1,info.col).value);

      if(course){
        rows.push({
          semester:semesterFromCode(info.code),
          no:no++,
          mataKuliah:course,
          sks:"",
          ruang:roomFor(ws,info.col,r),
          hari:label,
          waktu:times[String(jam)] || "",
          dosen:teacher
        });
      }
      jam++;
    }
  }

  return {reg, code:info.code, semester:semesterFromCode(info.code), data:rows};
}

function parseAll(){
  const arr=[];
  for(const reg of ["A","B","CS"]){
    const cfg=CONFIG[reg];
    const ws=wb.Sheets[cfg.sheet];
    if(!ws) continue;
    const codes=findCodes(ws,cfg.headerRow);
    for(const info of codes){
      const cls=parseClass(ws,cfg,info,reg);
      // Kelas hanya ditampilkan jika memang ada mata kuliah.
      if(cls.data.length) arr.push(cls);
    }
  }
  return arr;
}

function regName(reg){
  return reg==="A"?"REGULER A":reg==="B"?"REGULER B":"REGULER C";
}

function fillKelas(){
  const reg=document.getElementById("reg").value;
  const sel=document.getElementById("kelas");
  sel.innerHTML='<option value="">Pilih kode kelas</option>';

  const list=reg==="ALL"?classes:classes.filter(x=>x.reg===reg);
  list.forEach(x=>{
    const o=document.createElement("option");
    o.value=x.reg+"|"+x.code;
    o.textContent=x.code;
    sel.appendChild(o);
  });

  const mode=document.getElementById("mode").value;
  sel.disabled=(mode==="single" && list.length===0);
  document.getElementById("show").disabled=list.length===0;
}

function tableHTML(cls){
  let h=`
  <div class="table-card">
    <div class="title">${esc(regName(cls.reg))} ${esc(cls.code)}</div>
    <div class="subtitle">Semester ${esc(cls.semester)} • ${cls.data.length} mata kuliah</div>
    <table>
      <thead><tr>
        <th>SEMESTER</th>
        <th>NO</th>
        <th>MATA KULIAH</th>
        <th>SKS</th>
        <th>RUANG</th>
        <th>HARI / KETERANGAN</th>
        <th>WAKTU</th>
        <th>DOSEN PENGAMPU</th>
      </tr></thead><tbody>`;

  cls.data.forEach(r=>{
    h+=`<tr>
      <td class="center">${esc(r.semester)}</td>
      <td class="center">${esc(r.no)}</td>
      <td>${esc(r.mataKuliah)}</td>
      <td class="center">${esc(r.sks)}</td>
      <td>${esc(r.ruang)}</td>
      <td>${esc(r.hari)}</td>
      <td>${esc(r.waktu)}</td>
      <td>${esc(r.dosen)}</td>
    </tr>`;
  });

  return h+"</tbody></table></div>";
}

function show(){
  const reg=document.getElementById("reg").value;
  const mode=document.getElementById("mode").value;
  const key=document.getElementById("kelas").value;

  if(mode==="single" && !key){
    document.getElementById("status").innerHTML='<div class="error">Pilih kode kelas dulu.</div>';
    return;
  }

  if(mode==="single"){
    const [r,c]=key.split("|");
    shown=classes.filter(x=>x.reg===r && x.code===c);
  }else{
    shown=reg==="ALL"?classes:classes.filter(x=>x.reg===reg);
  }

  if(!shown.length){
    document.getElementById("status").innerHTML='<div class="error">Data tidak ditemukan.</div>';
    document.getElementById("hasil").innerHTML="";
    document.getElementById("download").disabled=true;
    return;
  }

  let total=0;
  shown.forEach(x=>total+=x.data.length);
  document.getElementById("status").innerHTML=
    `<div class="success"><b>${shown.length} kelas</b> ditampilkan sebagai <b>${shown.length} tabel terpisah</b>, total ${total} mata kuliah.</div>`;

  document.getElementById("hasil").innerHTML=
    `<div class="summary">Hasil Jadwal</div>`+shown.map(tableHTML).join("");

  document.getElementById("download").disabled=false;
}

function safeSheetName(name,used){
  let base=name.replace(/[\\\/\?\*\[\]:]/g," ").slice(0,31).trim() || "Kelas";
  let out=base, n=2;
  while(used.has(out)){
    const suffix=" ("+n+++")";
    out=base.slice(0,31-suffix.length)+suffix;
  }
  used.add(out);
  return out;
}

function download(){
  if(!shown.length) return;

  const outWb=XLSX.utils.book_new();
  const used=new Set();

  // Setiap kelas = SATU worksheet sendiri.
  shown.forEach(cls=>{
    const rows=[
      [`${regName(cls.reg)} ${cls.code}`],
      ["SEMESTER","NO","MATA KULIAH","SKS","RUANG","HARI / KETERANGAN","WAKTU","DOSEN PENGAMPU"]
    ];
    cls.data.forEach(r=>rows.push([
      r.semester,r.no,r.mataKuliah,r.sks,r.ruang,r.hari,r.waktu,r.dosen
    ]));

    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[
      {wch:12},{wch:7},{wch:34},{wch:8},
      {wch:15},{wch:20},{wch:20},{wch:28}
    ];
    XLSX.utils.book_append_sheet(outWb,ws,
      safeSheetName(`${regName(cls.reg)} ${cls.code}`,used));
  });

  XLSX.writeFile(outWb,"Jadwal_Prodi_Akuntansi.xlsx");
}

document.getElementById("file").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();

  reader.onload=ev=>{
    try{
      wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true});
      classes=parseAll();

      document.getElementById("reg").disabled=false;
      document.getElementById("mode").disabled=false;
      document.getElementById("reg").value="ALL";
      document.getElementById("mode").value="all";
      fillKelas();

      const a=classes.filter(x=>x.reg==="A").length;
      const b=classes.filter(x=>x.reg==="B").length;
      const c=classes.filter(x=>x.reg==="CS").length;

      document.getElementById("fileStatus").innerHTML=
        `<div class="success">File berhasil dibaca. Terdeteksi <b>${classes.length} kelas</b>: Reg A ${a}, Reg B ${b}, Reg C/CS ${c}.</div>`;

      document.getElementById("status").innerHTML=
        `<div class="info">Pilih <b>Semua Reguler → Semua kelas</b> untuk melihat semua kelas. Setiap kelas akan menjadi tabel sendiri.</div>`;
    }catch(err){
      console.error(err);
      document.getElementById("fileStatus").innerHTML=
        `<div class="error">Gagal membaca Excel: ${esc(err.message)}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById("reg").addEventListener("change",fillKelas);
document.getElementById("mode").addEventListener("change",()=>{
  fillKelas();
});
document.getElementById("show").addEventListener("click",show);
document.getElementById("download").addEventListener("click",download);
</script>
</body>
</html>
