<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengolah Jadwal Akuntansi</title>

  <!-- Library untuk membaca Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: .8;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    input[type="file"] {
      width: 100%;
      padding: 14px;
      border: 2px dashed #bbb;
      border-radius: 10px;
      background: #fafafa;
      cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    select,
    input[type="text"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    button {
      margin-top: 15px;
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .info {
      padding: 12px;
      background: #eef2ff;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 14px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .class-title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 11px 9px;
      text-align: left;
    }

    th {
      background: #111827;
      color: white;
      text-align: center;
    }

    td.no {
      text-align: center;
      width: 50px;
    }

    @media(max-width: 700px) {
      .controls {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }

      th,
      td {
        padding: 8px 5px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Pengolah Jadwal Prodi Akuntansi</h1>
    <p>Otomatis mengolah data kelas, mata kuliah, dan dosen</p>
  </div>

  <div class="container">

    <!-- UPLOAD -->
    <div class="card">
      <h2>1. Upload File Excel</h2>

      <input
        type="file"
        id="excelFile"
        accept=".xlsx,.xls"
      >

      <div id="uploadStatus"></div>
    </div>


    <!-- PILIH KELAS -->
    <div class="card">

      <h2>2. Pilih Kelas</h2>

      <div class="controls">

        <div>
          <label>Sheet</label>
          <select id="sheetSelect">
            <option value="">Upload Excel terlebih dahulu</option>
          </select>
        </div>

        <div>
          <label>Kode Kelas</label>
          <select id="kodeSelect">
            <option value="">Pilih kode kelas</option>
          </select>
        </div>

      </div>

      <button onclick="prosesJadwal()">
        Tampilkan Jadwal
      </button>

      <div id="processStatus"></div>

    </div>


    <!-- HASIL -->
    <div class="card">

      <div id="hasil"></div>

    </div>

  </div>


<script>

let workbook = null;


/* =========================
   UPLOAD EXCEL
========================= */

document.getElementById("excelFile").addEventListener("change", function(e) {

  const file = e.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {

    try {

      const data = new Uint8Array(event.target.result);

      workbook = XLSX.read(data, {
        type: "array"
      });

      const sheetSelect = document.getElementById("sheetSelect");

      sheetSelect.innerHTML = "";

      workbook.SheetNames.forEach(function(sheetName) {

        const option = document.createElement("option");

        option.value = sheetName;
        option.textContent = sheetName;

        sheetSelect.appendChild(option);

      });

      document.getElementById("uploadStatus").innerHTML =
        '<div class="success">File berhasil dibaca. Pilih sheet untuk melanjutkan.</div>';

      loadCodes();

    } catch(error) {

      document.getElementById("uploadStatus").innerHTML =
        '<div class="error">File Excel tidak dapat dibaca.</div>';

      console.error(error);

    }

  };

  reader.readAsArrayBuffer(file);

});


/* =========================
   SAAT SHEET DIGANTI
========================= */

document.getElementById("sheetSelect").addEventListener("change", function() {

  loadCodes();

});


/* =========================
   CARI KODE KELAS
========================= */

function loadCodes() {

  if (!workbook) return;

  const sheetName =
    document.getElementById("sheetSelect").value;

  if (!sheetName) return;

  const sheet = workbook.Sheets[sheetName];

  const range = XLSX.utils.decode_range(sheet["!ref"]);

  const kodeSet = new Set();

  for (let r = range.s.r; r <= range.e.r; r++) {

    for (let c = range.s.c; c <= range.e.c; c++) {

      const cellAddress =
        XLSX.utils.encode_cell({
          r: r,
          c: c
        });

      const cell = sheet[cellAddress];

      if (!cell) continue;

      const value = String(cell.v).trim();

      /*
        Mencari kode seperti:
        01AKSP001
        01AKSP002
        01AKSP003
      */

      const match =
        value.match(/01AKSP[0-9]+/i);

      if (match) {

        kodeSet.add(
          match[0].toUpperCase()
        );

      }

    }

  }

  const kodeSelect =
    document.getElementById("kodeSelect");

  kodeSelect.innerHTML =
    '<option value="">Pilih kode kelas</option>';

  Array.from(kodeSet)
    .sort()
    .forEach(function(kode) {

      const option =
        document.createElement("option");

      option.value = kode;
      option.textContent = kode;

      kodeSelect.appendChild(option);

    });

  if (kodeSet.size === 0) {

    document.getElementById("processStatus").innerHTML =
      '<div class="error">Kode kelas seperti 01AKSP001 tidak ditemukan di sheet ini.</div>';

  } else {

    document.getElementById("processStatus").innerHTML =
      '<div class="success">' +
      kodeSet.size +
      ' kode kelas ditemukan.' +
      '</div>';

  }

}


/* =========================
   CARI POSISI KODE
========================= */

function findKodeCell(sheet, kode) {

  const range =
    XLSX.utils.decode_range(sheet["!ref"]);

  for (let r = range.s.r; r <= range.e.r; r++) {

    for (let c = range.s.c; c <= range.e.c; c++) {

      const address =
        XLSX.utils.encode_cell({
          r: r,
          c: c
        });

      const cell = sheet[address];

      if (!cell) continue;

      const value =
        String(cell.v).trim().toUpperCase();

      if (value.includes(kode)) {

        return {
          row: r,
          col: c
        };

      }

    }

  }

  return null;

}


/* =========================
   AMBIL NILAI CELL
========================= */

function getCellValue(sheet, row, col) {

  const address =
    XLSX.utils.encode_cell({
      r: row,
      c: col
    });

  const cell = sheet[address];

  if (!cell) return "";

  return String(cell.v).trim();

}


/* =========================
   PROSES JADWAL
========================= */

function prosesJadwal() {

  if (!workbook) {

    alert("Upload file Excel terlebih dahulu.");

    return;

  }

  const sheetName =
    document.getElementById("sheetSelect").value;

  const kode =
    document.getElementById("kodeSelect").value;

  if (!kode) {

    alert("Pilih kode kelas terlebih dahulu.");

    return;

  }

  const sheet =
    workbook.Sheets[sheetName];

  const posisi =
    findKodeCell(sheet, kode);

  if (!posisi) {

    document.getElementById("hasil").innerHTML =
      '<div class="error">Kode kelas tidak ditemukan.</div>';

    return;

  }


  /*
    Berdasarkan format file jadwal:

    Baris kode kelas
          ↓
    DATA MATA KULIAH
    DATA DOSEN
    DATA MATA KULIAH
    DATA DOSEN
    dst.

    Kita membaca 8 pasangan data.
  */

  const startRow =
    posisi.row + 3;

  const data = [];


  for (let i = 0; i < 8; i++) {

    const matkul =
      getCellValue(
        sheet,
        startRow + (i * 2),
        posisi.col
      );

    const dosen =
      getCellValue(
        sheet,
        startRow + (i * 2) + 1,
        posisi.col
      );

    if (matkul || dosen) {

      data.push({
        no: i + 1,
        matkul: matkul,
        dosen: dosen
      });

    }

  }


  tampilkanHasil(kode, data);

}


/* =========================
   TAMPILKAN HASIL
========================= */

function tampilkanHasil(kode, data) {

  let html = "";

  html +=
    '<div class="class-title">' +
    'REGULER A ' +
    kode +
    '</div>';

  html += "<table>";

  html += "<thead>";

  html += "<tr>";

  html += "<th>NO</th>";
  html += "<th>MATA KULIAH</th>";
  html += "<th>SKS</th>";
  html += "<th>RUANG</th>";
  html += "<th>HARI</th>";
  html += "<th>WAKTU</th>";
  html += "<th>DOSEN PENGAMPU</th>";

  html += "</tr>";

  html += "</thead>";

  html += "<tbody>";


  if (data.length === 0) {

    html +=
      '<tr><td colspan="7" style="text-align:center">' +
      'Tidak ada data ditemukan.' +
      '</td></tr>';

  }


  data.forEach(function(item) {

    html += "<tr>";

    html +=
      '<td class="no">' +
      item.no +
      "</td>";

    html +=
      "<td>" +
      escapeHTML(item.matkul) +
      "</td>";

    /*
      Kolom ini sengaja kosong dulu.
      Nanti bisa kita hubungkan ke data SKS.
    */

    html += "<td></td>";

    html += "<td></td>";

    html += "<td></td>";

    html += "<td></td>";

    html +=
      "<td>" +
      escapeHTML(item.dosen) +
      "</td>";

    html += "</tr>";

  });


  html += "</tbody>";

  html += "</table>";

  document.getElementById("hasil").innerHTML =
    html;

}


/* =========================
   AMANKAN TEKS HTML
========================= */

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
