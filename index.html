<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengolah Jadwal Prodi Akuntansi</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f9;
    color: #111827;
}

.header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.header h1 {
    margin: 0;
    font-size: 34px;
}

.header p {
    margin-top: 12px;
    font-size: 20px;
    color: #d1d5db;
}

.container {
    max-width: 1500px;
    margin: 40px auto;
    padding: 0 20px;
}

.card {
    background: white;
    padding: 30px;
    margin-bottom: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
select,
button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-size: 16px;
}

select {
    background: white;
}

button {
    background: #111827;
    color: white;
    font-weight: bold;
    cursor: pointer;
    border: none;
}

button:hover {
    background: #1f2937;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.success {
    background: #dcfce7;
    color: #166534;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
}

.table-card {
    overflow-x: auto;
}

.jadwal-title {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 25px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1000px;
}

th {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
}

td {
    padding: 15px;
    border: 1px solid #d1d5db;
}

td:first-child {
    text-align: center;
    width: 70px;
}

.no-data {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

@media(max-width: 800px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Pengolah Jadwal Prodi Akuntansi</h1>
    <p>Otomatis mengolah data kelas, mata kuliah, dan dosen</p>
</div>

<div class="container">

    <!-- UPLOAD -->
    <div class="card">

        <h2>1. Upload File Excel</h2>

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >

        <div id="fileStatus"></div>

    </div>


    <!-- PILIH KELAS -->
    <div class="card">

        <h2>2. Pilih Kelas</h2>

        <div class="grid">

            <div>
                <label>Sheet</label>

                <select id="sheetSelect">
                    <option value="">Pilih sheet</option>
                </select>
            </div>

            <div>
                <label>Kode Kelas</label>

                <select id="classSelect">
                    <option value="">Pilih kode kelas</option>
                </select>
            </div>

        </div>

        <br>

        <button id="showButton">
            Tampilkan Jadwal
        </button>

        <div id="classStatus"></div>

    </div>


    <!-- HASIL -->
    <div id="result"></div>

</div>


<script>

let workbook = null;
let currentSheetData = [];
let currentCodes = [];


/* =====================================================
   NORMALISASI TEKS
===================================================== */

function cleanValue(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/\s+/g, " ")
        .trim();
}


/* =====================================================
   NORMALISASI KODE KELAS
===================================================== */

function normalizeCode(value) {

    return cleanValue(value)
        .toUpperCase();

}


/* =====================================================
   CEK KODE KELAS
===================================================== */

function isClassCode(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return false;
    }

    const text = normalizeCode(value);

    return /^\d{2}\s*AKS[PME]\d{3}(?:\s*\([^)]*\))?$/.test(text);

}


/* =====================================================
   BASE KODE
   contoh:

   01AKSP001
   02 AKSM001
   05AKSM001 (PJK)
===================================================== */

function getBaseCode(value) {

    const text = normalizeCode(value);

    const match =
        text.match(/^(\d{2}\s*AKS[PME]\d{3})/);

    if (!match) {
        return "";
    }

    return match[1]
        .replace(/\s+/g, "")
        .toUpperCase();

}


/* =====================================================
   UPLOAD EXCEL
===================================================== */

document
.getElementById("excelFile")
.addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {

        try {

            const data =
                new Uint8Array(
                    event.target.result
                );

            workbook =
                XLSX.read(data, {
                    type: "array",
                    cellDates: true
                });


            const sheetSelect =
                document.getElementById(
                    "sheetSelect"
                );


            sheetSelect.innerHTML =
                '<option value="">Pilih sheet</option>';


            workbook.SheetNames.forEach(
                function(sheetName) {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        sheetName;

                    option.textContent =
                        sheetName;

                    sheetSelect.appendChild(
                        option
                    );

                }
            );


            document
            .getElementById("fileStatus")
            .innerHTML =
                '<div class="success">' +
                'File berhasil dibaca. Pilih sheet untuk melanjutkan.' +
                '</div>';


        } catch(error) {

            console.error(error);

            document
            .getElementById("fileStatus")
            .innerHTML =
                '<div class="error">' +
                'File Excel gagal dibaca.' +
                '</div>';

        }

    };


    reader.readAsArrayBuffer(file);

});


/* =====================================================
   PILIH SHEET
===================================================== */

document
.getElementById("sheetSelect")
.addEventListener("change", function() {

    const sheetName =
        this.value;


    const classSelect =
        document.getElementById(
            "classSelect"
        );


    classSelect.innerHTML =
        '<option value="">Pilih kode kelas</option>';


    document
    .getElementById("classStatus")
    .innerHTML = "";


    document
    .getElementById("result")
    .innerHTML = "";


    if (
        !sheetName ||
        !workbook
    ) {
        return;
    }


    const worksheet =
        workbook.Sheets[sheetName];


    currentSheetData =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header: 1,
                defval: "",
                raw: false
            }
        );


    currentCodes =
        findClassCodes(
            currentSheetData
        );


    currentCodes.forEach(
        function(code) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                code;

            option.textContent =
                code;

            classSelect.appendChild(
                option
            );

        }
    );


    document
    .getElementById("classStatus")
    .innerHTML =
        '<div class="success">' +
        currentCodes.length +
        ' kode kelas ditemukan.' +
        '</div>';

});


/* =====================================================
   CARI SEMUA KODE KELAS
===================================================== */

function findClassCodes(rows) {

    const codes = [];


    rows.forEach(
        function(row) {

            row.forEach(
                function(cell) {

                    if (
                        cell === null ||
                        cell === undefined
                    ) {
                        return;
                    }


                    const text =
                        normalizeCode(cell);


                    if (
                        !isClassCode(text)
                    ) {
                        return;
                    }


                    if (
                        !codes.includes(text)
                    ) {

                        codes.push(text);

                    }

                }
            );

        }
    );


    return codes;

}


/* =====================================================
   CARI WAKTU BERDASARKAN JAM KE
=====================================================

   Excel Reg A:

   Jam Ke 1 = 07.10 - 08.50
   Jam Ke 2 = 08.50 - 10.30
   Jam Ke 3 = 10.30 - 12.10
   Jam Ke 4 = 13.00 - 14.40
   Jam Ke 5 = 14.40 - 16.30

   Reg CS dan Reg B juga dibaca
   otomatis dari bagian NB Excel.
===================================================== */

function findTimeMap(rows) {

    const timeMap = {};


    for (
        let r = 0;
        r < rows.length;
        r++
    ) {

        const row = rows[r];

        const hasJamKe =
            row.some(
                cell =>
                    cleanValue(cell)
                    .toUpperCase()
                    === "JAM KE"
            );


        if (!hasJamKe) {
            continue;
        }


        let nomorJam = "";


        if (
            row[2] !== undefined &&
            row[2] !== ""
        ) {

            const n =
                parseInt(
                    row[2],
                    10
                );

            if (!isNaN(n)) {
                nomorJam = String(n);
            }

        }


        if (!nomorJam) {
            continue;
        }


        for (
            let c = 0;
            c < row.length;
            c++
        ) {

            const value =
                cleanValue(row[c]);


            if (
                /^\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}$/
                .test(value)
            ) {

                timeMap[nomorJam] =
                    value;

                break;

            }

        }

    }


    return timeMap;

}


/* =====================================================
   CARI HARI

   Hari pada Excel menggunakan
   kolom B dan kadang berada pada
   baris kedua dari pasangan dosen/matkul.
===================================================== */

function findDayMarkers(rows) {

    const markers = [];

    const validDays = [
        "SENIN",
        "SELASA",
        "RABU",
        "KAMIS",
        "JUMAT",
        "JUM'AT",
        "SABTU",
        "MINGGU"
    ];


    for (
        let r = 0;
        r < rows.length;
        r++
    ) {

        const value =
            cleanValue(rows[r][1])
            .toUpperCase();


        if (
            validDays.includes(value)
        ) {

            markers.push({
                row: r,
                day: cleanValue(rows[r][1])
            });

        }

    }


    return markers;

}


/* =====================================================
   AMBIL HARI UNTUK BARIS TERTENTU
===================================================== */

function getDayForRow(
    markers,
    rowNumber
) {

    if (!markers.length) {
        return "";
    }


    let previous = null;


    for (
        let i = 0;
        i < markers.length;
        i++
    ) {

        if (
            markers[i].row <= rowNumber
        ) {

            previous =
                markers[i];

        }

    }


    if (previous) {

        return previous.day;

    }


    return markers[0].day;

}


/* =====================================================
   CARI POSISI KODE KELAS
===================================================== */

function findClassPosition(
    rows,
    selectedCode
) {

    const target =
        normalizeCode(
            selectedCode
        );


    const targetBase =
        getBaseCode(target);


    for (
        let r = 0;
        r < rows.length;
        r++
    ) {

        for (
            let c = 0;
            c < rows[r].length;
            c++
        ) {

            const value =
                normalizeCode(
                    rows[r][c]
                );


            if (
                !isClassCode(value)
            ) {
                continue;
            }


            const base =
                getBaseCode(value);


            if (
                value === target ||
                base === targetBase
            ) {

                return {
                    row: r,
                    col: c,
                    originalCode: value
                };

            }

        }

    }


    return null;

}


/* =====================================================
   PARSER JADWAL
===================================================== */

function parseClassSchedule(
    rows,
    selectedCode
) {

    const position =
        findClassPosition(
            rows,
            selectedCode
        );


    if (!position) {
        return null;
    }


    const codeRow =
        position.row;


    const classCol =
        position.col;


    /*
       Baris setelah kode kelas
       berisi:

       DOSEN / MATAKULIAH
       Ruangan

       Kalau ada Ruangan di kolom
       sebelahnya, berarti sheet
       memiliki kolom ruang.
    */

    let roomCol = null;


    if (
        rows[codeRow + 1] &&
        cleanValue(
            rows[codeRow + 1][classCol + 1]
        ).toUpperCase()
        === "RUANGAN"
    ) {

        roomCol =
            classCol + 1;

    }


    const timeMap =
        findTimeMap(rows);


    const dayMarkers =
        findDayMarkers(rows);


    const data = [];


    /*
       Data dimulai 2 baris
       setelah kode kelas.

       Struktur:

       DOSEN
       MATA KULIAH

       DOSEN
       MATA KULIAH
    */

    for (
        let r = codeRow + 2;
        r < rows.length - 1;
        r++
    ) {

        /*
           Berhenti ketika masuk
           bagian NB / Jam Ke.
        */

        const bValue =
            cleanValue(
                rows[r][1]
            ).toUpperCase();


        if (
            bValue === "NB" ||
            bValue === "JAM KE"
        ) {

            break;

        }


        /*
           Jam ke ada di kolom C.
        */

        const jamValue =
            cleanValue(
                rows[r][2]
            );


        if (!jamValue) {
            continue;
        }


        const jam =
            parseInt(
                jamValue,
                10
            );


        if (
            isNaN(jam)
        ) {
            continue;
        }


        /*
           Baris r = DOSEN
           Baris r+1 = MATA KULIAH
        */

        const dosen =
            cleanValue(
                rows[r][classCol]
            );


        const mataKuliah =
            cleanValue(
                rows[r + 1][classCol]
            );


        /*
           Kalau salah satu kosong,
           bukan data jadwal.
        */

        if (
            !dosen ||
            !mataKuliah
        ) {

            continue;

        }


        /*
           Jangan masukkan waktu
           yang kebaca sebagai matkul.
        */

        if (
            isTimeValue(mataKuliah)
        ) {

            continue;

        }


        /*
           Hari kadang ada pada
           baris r+1.
        */

        let day =
            getDayForRow(
                dayMarkers,
                r
            );


        const dayNext =
            cleanValue(
                rows[r + 1][1]
            );


        if (
            dayNext &&
            /^[A-ZÀ-Ÿ' ]+$/i.test(dayNext)
        ) {

            const upper =
                dayNext.toUpperCase();

            if (
                [
                    "SENIN",
                    "SELASA",
                    "RABU",
                    "KAMIS",
                    "JUMAT",
                    "JUM'AT",
                    "SABTU",
                    "MINGGU"
                ].includes(upper)
            ) {

                day = dayNext;

            }

        }


        /*
           Ruangan
        */

        let ruang = "";


        if (
            roomCol !== null
        ) {

            ruang =
                cleanValue(
                    rows[r][roomCol]
                );

        }


        data.push({

            no: data.length + 1,

            mataKuliah:
                mataKuliah,

            sks: "",

            ruang:
                ruang,

            hari:
                day,

            waktu:
                timeMap[String(jam)]
                || "Jam ke " + jam,

            dosen:
                dosen

        });


        /*
           Lewati baris mata kuliah
        */

        r++;

    }


    return {
        code:
            position.originalCode,

        data:
            data

    };

}


/* =====================================================
   DETEKSI NILAI WAKTU
===================================================== */

function isTimeValue(text) {

    if (!text) {
        return false;
    }


    return /^\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}$/
        .test(
            text.trim()
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   TAMPILKAN JADWAL
===================================================== */

function displaySchedule(
    code,
    data
) {

    let html = `

        <div class="card table-card">

            <div class="jadwal-title">
                ${escapeHtml(code)}
            </div>

            <table>

                <thead>

                    <tr>

                        <th>NO</th>

                        <th>MATA KULIAH</th>

                        <th>SKS</th>

                        <th>RUANG</th>

                        <th>HARI</th>

                        <th>WAKTU</th>

                        <th>DOSEN PENGAMPU</th>

                    </tr>

                </thead>

                <tbody>

    `;


    if (
        data.length === 0
    ) {

        html += `

            <tr>

                <td
                    colspan="7"
                    class="no-data"
                >
                    Tidak ada data jadwal
                    untuk kelas ini.
                </td>

            </tr>

        `;

    } else {

        data.forEach(
            function(row) {

                html += `

                    <tr>

                        <td>
                            ${escapeHtml(row.no)}
                        </td>

                        <td>
                            ${escapeHtml(row.mataKuliah)}
                        </td>

                        <td>
                            ${escapeHtml(row.sks)}
                        </td>

                        <td>
                            ${escapeHtml(row.ruang)}
                        </td>

                        <td>
                            ${escapeHtml(row.hari)}
                        </td>

                        <td>
                            ${escapeHtml(row.waktu)}
                        </td>

                        <td>
                            ${escapeHtml(row.dosen)}
                        </td>

                    </tr>

                `;

            }
        );

    }


    html += `

                </tbody>

            </table>

        </div>

    `;


    document
    .getElementById("result")
    .innerHTML = html;

}


/* =====================================================
   TOMBOL TAMPILKAN
===================================================== */

document
.getElementById("showButton")
.addEventListener(
    "click",
    function() {

        const code =
            document
            .getElementById(
                "classSelect"
            )
            .value;


        if (!code) {

            document
            .getElementById(
                "classStatus"
            )
            .innerHTML =
                '<div class="error">' +
                'Silakan pilih kode kelas terlebih dahulu.' +
                '</div>';

            return;

        }


        const result =
            parseClassSchedule(
                currentSheetData,
                code
            );


        if (!result) {

            document
            .getElementById(
                "classStatus"
            )
            .innerHTML =
                '<div class="error">' +
                'Kode kelas tidak ditemukan.' +
                '</div>';

            document
            .getElementById(
                "result"
            )
            .innerHTML = "";

            return;

        }


        document
        .getElementById(
            "classStatus"
        )
        .innerHTML =
            '<div class="success">' +
            result.data.length +
            ' mata kuliah ditemukan untuk kelas ' +
            escapeHtml(code) +
            '.</div>';


        displaySchedule(
            code,
            result.data
        );

    }
);

</script>

</body>
</html>
