<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengolah Jadwal Prodi Akuntansi</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#111827}
.header{background:#111827;color:white;text-align:center;padding:35px 20px}
.header h1{margin:0;font-size:34px}.header p{margin:10px 0 0;color:#d1d5db;font-size:18px}
.container{max-width:1550px;margin:35px auto;padding:0 20px}
.card{background:#fff;padding:28px;margin-bottom:25px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
h2{margin-top:0}label{display:block;font-weight:bold;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
input,select,button{width:100%;padding:14px;border-radius:10px;border:1px solid #d1d5db;font-size:16px}
button{background:#111827;color:#fff;font-weight:bold;cursor:pointer;border:none}
button:hover{background:#1f2937}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}
.btn-download{background:#166534}.btn-download:hover{background:#14532d}
.success{background:#dcfce7;color:#166534;padding:14px;border-radius:10px;margin-top:18px}
.error{background:#fee2e2;color:#991b1b;padding:14px;border-radius:10px;margin-top:18px}
.hint{color:#6b7280;margin-top:8px;font-size:14px}
.result-summary{font-weight:bold;margin:10px 0 22px;font-size:18px}
.table-card{background:#fff;padding:25px;margin:0 0 28px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08);overflow-x:auto}
.jadwal-title{text-align:center;font-size:28px;font-weight:bold;margin-bottom:7px}
.jadwal-subtitle{text-align:center;color:#6b7280;margin-bottom:20px}
table{width:100%;border-collapse:collapse;min-width:1000px}
th{background:#111827;color:#fff;padding:14px 12px;text-align:center}
td{padding:12px;border:1px solid #d1d5db;vertical-align:top}
td.no{text-align:center;width:60px}
.empty{text-align:center;color:#6b7280;padding:25px}
.badge{display:inline-block;background:#e5e7eb;border-radius:999px;padding:4px 10px;font-size:13px}
@media(max-width:900px){.grid,.actions{grid-template-columns:1fr}.header h1{font-size:26px}}
</style>
</head>
<body>

<div class="header">
  <h1>Pengolah Jadwal Prodi Akuntansi</h1>
  <p>Satu kelas = satu tabel. Bisa tampilkan satu, semua dalam satu reguler, atau semua reguler.</p>
</div>

<div class="container">

  <div class="card">
    <h2>1. Upload File Excel</h2>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
    <div id="fileStatus"></div>
    <div class="hint">File dibaca langsung di browser. Tidak perlu upload ke server.</div>
  </div>

  <div class="card">
    <h2>2. Pilih Tampilan</h2>
    <div class="grid">
      <div>
        <label>Reguler</label>
        <select id="regSelect" disabled>
          <option value="">Pilih reguler</option>
          <option value="ALL">Semua Reguler</option>
          <option value="Reg A">Reg A</option>
          <option value="Reg B">Reg B</option>
          <option value="Reg C">Reg C</option>
        </select>
      </div>
      <div>
        <label>Kelas</label>
        <select id="classSelect" disabled>
          <option value="">Pilih kelas</option>
        </select>
      </div>
      <div>
        <label>Mode</label>
        <select id="modeSelect">
          <option value="single">Satu kelas</option>
          <option value="all">Semua kelas</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="showButton" disabled>Tampilkan Jadwal</button>
      <button id="downloadButton" class="btn-download" disabled>Download Excel</button>
    </div>
    <div id="classStatus"></div>
  </div>

  <div id="result"></div>
</div>

<script>
let workbook = null;
let parsedData = [];
let displayedRows = [];

const SHEET_MAP = {
  "Reg A": "Reg A",
  "Reg B": "Reg B",
  "Reg C": "Reg CS"
};

const CODE_RE = /\b\d{2}\s*AKS[A-Z]{1,3}\s*\d{3}(?:\s*\([^)]*\))?\b/gi;

function clean(v){
  if(v === null || v === undefined) return "";
  return String(v).replace(/\s+/g," ").trim();
}

function normalizeCode(v){
  return clean(v).replace(/\s+/g,"").toUpperCase();
}

function escapeHtml(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function looksLikeCode(v){
  return /^\d{2}AKS[A-Z]{1,3}\d{3}$/i.test(normalizeCode(v));
}

function findClassColumns(rows){
  const found = [];
  const seen = new Set();

  // Kode kelas biasanya berada di satu baris header.
  for(let r=0;r<Math.min(rows.length,12);r++){
    for(let c=0;c<rows[r].length;c++){
      const raw = clean(rows[r][c]);
      if(!raw) continue;

      const matches = raw.match(CODE_RE);
      if(matches){
        for(const m of matches){
          const code = normalizeCode(m);
          if(looksLikeCode(code) && !seen.has(code)){
            seen.add(code);
            found.push({code, col:c, headerRow:r});
          }
        }
      }
    }
  }
  return found;
}

function fillForward(rows, col, startRow, endRow){
  let last = "";
  const out = [];
  for(let r=startRow;r<=endRow;r++){
    const v = clean(rows[r]?.[col]);
    if(v) last = v;
    out.push(last);
  }
  return out;
}

function findDayAt(rows, r){
  let i=r;
  while(i>=0){
    const v=clean(rows[i]?.[1]);
    if(v) return v;
    i--;
  }
  return "";
}

function isNumberTime(v){
  const n = Number(v);
  return Number.isFinite(n) && n >= 1 && n <= 20;
}

function findFirstDataRow(rows, headerRow){
  return Math.min(rows.length-1, headerRow+1);
}

function parseClass(rows, classInfo){
  const col = classInfo.col;
  const code = classInfo.code;
  const headerRow = classInfo.headerRow;
  const start = findFirstDataRow(rows, headerRow);

  // Untuk sheet Reg A/B, setiap slot terdiri dari 2 baris:
  // baris pertama = dosen, baris berikutnya = mata kuliah.
  // Reg CS juga mengikuti pola yang sama.
  const data = [];

  let currentDay = "";
  let currentJam = "";

  for(let r=start;r<rows.length-1;r++){
    const dayCell = clean(rows[r]?.[1]);
    if(dayCell) currentDay = dayCell;

    const jamCell = clean(rows[r]?.[2]);
    if(isNumberTime(jamCell)) currentJam = jamCell;

    // Jam berada pada baris dosen; mata kuliah berada di baris berikutnya.
    if(isNumberTime(jamCell)){
      const dosen = clean(rows[r]?.[col]);
      const mata = clean(rows[r+1]?.[col]);

      if(mata && !looksLikeCode(mata)){
        let ruang = "";
        const roomCell = clean(rows[r]?.[col+1]);
        const roomNext = clean(rows[r+1]?.[col+1]);
        if(roomCell && roomCell.toUpperCase() !== "DOSEN / MATAKULIAH" && roomCell.toUpperCase() !== "RUANGAN")
          ruang = roomCell;
        else if(roomNext && roomNext.toUpperCase() !== "DOSEN / MATAKULIAH" && roomNext.toUpperCase() !== "RUANGAN")
          ruang = roomNext;

        data.push({
          no:data.length+1,
          mataKuliah:mata,
          sks:"",
          ruang:ruang,
          hari:currentDay,
          jamKe:currentJam,
          waktu:"",
          dosen:dosen
        });
      }
    }
  }

  // Fallback: bila format tertentu tidak mengisi JAM seperti pola normal,
  // ambil pasangan baris yang berisi teks.
  if(data.length===0){
    let day = "";
    let jam = "";
    for(let r=start;r<rows.length-1;r++){
      if(clean(rows[r]?.[1])) day=clean(rows[r][1]);
      if(isNumberTime(rows[r]?.[2])) jam=clean(rows[r][2]);

      const a=clean(rows[r]?.[col]);
      const b=clean(rows[r+1]?.[col]);
      if(b && !looksLikeCode(b)){
        data.push({
          no:data.length+1,mataKuliah:b,sks:"",ruang:"",
          hari:day,jamKe:jam,waktu:"",dosen:a
        });
      }
    }
  }

  return {reg:"", code, data};
}

function parseSheet(sheetName, regLabel){
  const ws = workbook.Sheets[sheetName];
  if(!ws) return [];

  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
  const classes = findClassColumns(rows);

  const result=[];
  for(const info of classes){
    const parsed=parseClass(rows,info);
    parsed.reg=regLabel;
    result.push(parsed);
  }

  // Hapus kelas yang ternyata benar-benar tidak punya data.
  return result.filter(x=>x.data.length>0);
}

function parseAll(){
  const all=[];
  for(const reg of ["Reg A","Reg B","Reg C"]){
    const sheet=SHEET_MAP[reg];
    if(workbook.SheetNames.includes(sheet)){
      all.push(...parseSheet(sheet,reg));
    }
  }
  return all;
}

function refreshClassOptions(){
  const reg=document.getElementById("regSelect").value;
  const select=document.getElementById("classSelect");
  select.innerHTML='<option value="">Pilih kelas</option>';

  let classes=[];
  if(reg==="ALL"){
    classes=parsedData;
  }else{
    classes=parsedData.filter(x=>x.reg===reg);
  }

  classes.forEach(x=>{
    const opt=document.createElement("option");
    opt.value=x.code;
    opt.textContent=x.code;
    select.appendChild(opt);
  });

  select.disabled=classes.length===0;
  document.getElementById("showButton").disabled=classes.length===0;
  document.getElementById("downloadButton").disabled=true;
}

function renderTable(cls){
  let html=`
  <div class="table-card">
    <div class="jadwal-title">${escapeHtml(cls.reg)} — ${escapeHtml(cls.code)}</div>
    <div class="jadwal-subtitle"><span class="badge">${cls.data.length} mata kuliah</span></div>
    <table>
      <thead>
        <tr>
          <th>NO</th>
          <th>MATA KULIAH</th>
          <th>SKS</th>
          <th>RUANG</th>
          <th>HARI</th>
          <th>JAM KE</th>
          <th>WAKTU</th>
          <th>DOSEN PENGAMPU</th>
        </tr>
      </thead>
      <tbody>`;

  if(!cls.data.length){
    html+=`<tr><td colspan="8" class="empty">Tidak ada data.</td></tr>`;
  }else{
    cls.data.forEach(row=>{
      html+=`
      <tr>
        <td class="no">${escapeHtml(row.no)}</td>
        <td>${escapeHtml(row.mataKuliah)}</td>
        <td>${escapeHtml(row.sks)}</td>
        <td>${escapeHtml(row.ruang)}</td>
        <td>${escapeHtml(row.hari)}</td>
        <td style="text-align:center">${escapeHtml(row.jamKe)}</td>
        <td>${escapeHtml(row.waktu)}</td>
        <td>${escapeHtml(row.dosen)}</td>
      </tr>`;
    });
  }

  html+=`</tbody></table></div>`;
  return html;
}

function showResults(){
  const reg=document.getElementById("regSelect").value;
  const mode=document.getElementById("modeSelect").value;
  const code=document.getElementById("classSelect").value;
  const result=document.getElementById("result");

  let classes=[];

  if(mode==="single"){
    if(!code){
      document.getElementById("classStatus").innerHTML='<div class="error">Pilih kelas terlebih dahulu.</div>';
      return;
    }
    const cls=parsedData.find(x=>x.reg===reg && x.code===code);
    if(cls) classes=[cls];
  }else{
    classes = reg==="ALL" ? parsedData : parsedData.filter(x=>x.reg===reg);
  }

  if(!classes.length){
    document.getElementById("classStatus").innerHTML='<div class="error">Data kelas tidak ditemukan.</div>';
    result.innerHTML="";
    return;
  }

  displayedRows=classes;
  document.getElementById("classStatus").innerHTML=
    `<div class="success">${classes.length} tabel kelas ditampilkan. Setiap kelas dibuat menjadi tabel terpisah.</div>`;

  const total=classes.reduce((n,x)=>n+x.data.length,0);
  let html=`<div class="result-summary">${classes.length} kelas • ${total} baris jadwal</div>`;
  classes.forEach(cls=>html+=renderTable(cls));
  result.innerHTML=html;

  document.getElementById("downloadButton").disabled=false;
}

function downloadExcel(){
  if(!displayedRows.length) return;

  const out=[];
  displayedRows.forEach(cls=>{
    // Satu kelas = satu worksheet.
    const rows=[
      [`${cls.reg} — ${cls.code}`],
      ["NO","MATA KULIAH","SKS","RUANG","HARI","JAM KE","WAKTU","DOSEN PENGAMPU"]
    ];
    cls.data.forEach(r=>rows.push([
      r.no,r.mataKuliah,r.sks,r.ruang,r.hari,r.jamKe,r.waktu,r.dosen
    ]));
    out.push({name:`${cls.reg} ${cls.code}`.slice(0,31), rows});
  });

  const newWb=XLSX.utils.book_new();

  out.forEach(item=>{
    const ws=XLSX.utils.aoa_to_sheet(item.rows);
    ws["!cols"]=[
      {wch:7},{wch:32},{wch:8},{wch:15},
      {wch:15},{wch:10},{wch:18},{wch:28}
    ];
    XLSX.utils.book_append_sheet(newWb,ws,item.name);
  });

  const stamp=new Date().toISOString().slice(0,10);
  XLSX.writeFile(newWb,`Jadwal_${stamp}.xlsx`);
}

document.getElementById("excelFile").addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file) return;

  const reader=new FileReader();
  reader.onload=function(event){
    try{
      workbook=XLSX.read(new Uint8Array(event.target.result),{
        type:"array",cellDates:true
      });

      parsedData=parseAll();

      const reg=document.getElementById("regSelect");
      reg.disabled=false;
      reg.value="ALL";
      refreshClassOptions();

      document.getElementById("fileStatus").innerHTML=
        `<div class="success">File berhasil dibaca. ${parsedData.length} kelas terdeteksi.</div>`;
      document.getElementById("classStatus").innerHTML=
        `<div class="success">Sekarang pilih "Semua kelas" untuk menampilkan semua kelas sebagai tabel terpisah.</div>`;
    }catch(err){
      console.error(err);
      document.getElementById("fileStatus").innerHTML=
        `<div class="error">Excel gagal dibaca: ${escapeHtml(err.message)}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById("regSelect").addEventListener("change",function(){
  refreshClassOptions();
});

document.getElementById("modeSelect").addEventListener("change",function(){
  const single=this.value==="single";
  document.getElementById("classSelect").disabled=single ? document.getElementById("classSelect").options.length<=1 : false;
  if(!single){
    document.getElementById("classSelect").value="";
  }
});

document.getElementById("showButton").addEventListener("click",showResults);
document.getElementById("downloadButton").addEventListener("click",downloadExcel);
</script>
</body>
</html>
