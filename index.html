<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#111827}
.header{background:#111827;color:#fff;text-align:center;padding:35px 20px}
.header h1{margin:0;font-size:34px}
.header p{margin:10px 0 0;color:#d1d5db;font-size:18px}
.container{max-width:1500px;margin:35px auto;padding:0 20px}
.card{background:#fff;padding:28px;margin-bottom:25px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
label{display:block;font-weight:700;margin-bottom:8px}
input,select,button{width:100%;padding:14px;border-radius:10px;border:1px solid #d1d5db;font-size:16px}
input:disabled,select:disabled{background:#f3f4f6;color:#9ca3af}
button{background:#111827;color:#fff;font-weight:700;cursor:pointer;border:0}
button:hover{background:#1f2937}
button:disabled{opacity:.5;cursor:not-allowed}
.button-row{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:18px}
.download{background:#166534}
.download:hover{background:#14532d}
.success,.error,.info{padding:14px;border-radius:10px;margin-top:18px}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.info{background:#e0f2fe;color:#075985}
.table-card{background:#fff;padding:25px;margin-bottom:28px;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08);overflow-x:auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px;flex-wrap:wrap}
.toolbar h2{margin:0}
.small{color:#6b7280}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1150px}
th{background:#111827;color:#fff;padding:13px;text-align:center;position:sticky;top:0}
td{padding:11px;border:1px solid #d1d5db;vertical-align:top}
td.center{text-align:center}
.reg-badge{font-weight:700;white-space:nowrap}
.empty{padding:35px;text-align:center;color:#6b7280}
.teacher-name{font-weight:700}
.teacher-code{font-size:12px;color:#64748b;margin-top:4px}
.teacher-card{border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:0 0 20px;background:#fff}
.teacher-card h3{margin:0 0 5px}
.teacher-meta{color:#64748b;margin-bottom:14px}
.teacher-table{min-width:900px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e5e7eb;font-weight:700;font-size:12px}
.conflict-card{border:1px solid #fecaca;border-left:6px solid #dc2626;border-radius:14px;padding:18px;margin:0 0 18px;background:#fff}
.conflict-title{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap;margin-bottom:12px}
.conflict-title h3{margin:0;color:#991b1b}
.conflict-meta{color:#64748b;margin-top:4px}
.conflict-table{min-width:900px}
.conflict-badge{background:#fee2e2;color:#991b1b}
.ok-badge{background:#dcfce7;color:#166534}

.teacher-summary{margin-top:20px}
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}
.summary-card{border:1px solid #e5e7eb;border-radius:14px;padding:18px;background:#f8fafc}
.summary-card.summary-total{background:#111827;color:#fff;border-color:#111827}
.summary-label{font-size:12px;font-weight:800;letter-spacing:.5px}
.summary-number{font-size:32px;font-weight:800;line-height:1.15;margin-top:5px}
.summary-note{font-size:13px;margin-top:3px;opacity:.75}
.recap-detail{border:1px solid #e5e7eb;border-radius:14px;padding:18px;background:#fff}
.recap-detail h3{margin:0 0 14px}
.recap-list{display:flex;flex-direction:column;gap:12px}
.recap-row{display:grid;grid-template-columns:180px 1fr;gap:15px;align-items:start;padding:14px;border-radius:12px;background:#f8fafc;border:1px solid #e5e7eb}
.recap-reg{display:flex;flex-direction:column;gap:4px}
.recap-reg span{font-size:12px;color:#64748b}
.recap-codes{display:flex;gap:7px;flex-wrap:wrap}
.class-pill{display:inline-block;padding:7px 10px;border-radius:999px;background:#e0f2fe;color:#075985;border:1px solid #bae6fd;font-size:13px;font-weight:700}
.muted{color:#94a3b8;font-size:13px}
@media(max-width:1100px){.summary-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.summary-grid{grid-template-columns:repeat(2,1fr)}.recap-row{grid-template-columns:1fr}}
@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.grid,.button-row{grid-template-columns:1fr}.header h1{font-size:25px}}

.mk-full{line-height:1.35}
.mk-code{font-size:.82em;color:#64748b;margin-top:3px}

<body>
<div class="header">
  <h1>Pengolah Jadwal Prodi Akuntansi</h1>
  <p>Upload Excel → pilih reguler → cari kelas/dosen → tampilkan → download Excel</p>
</div>

<div class="container">

  <div class="card">
    <h2>1. Upload File Excel</h2>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
    <div id="fileStatus"></div>
    <div class="small" style="margin-top:10px">
      Struktur mengikuti sheet <b>Reg A</b>, <b>Reg B</b>, dan <b>Reg CS</b>.
    </div>
  </div>

  <div class="card">
    <h2>2. Pilih Tampilan</h2>

    <div class="grid">
      <div>
        <label>Reguler</label>
        <select id="regSelect" disabled>
          <option value="">Upload Excel terlebih dahulu</option>
        </select>
      </div>

      <div>
        <label>Mode Tampilan</label>
        <select id="modeSelect" disabled>
          <option value="single">Satu kelas</option>
          <option value="all">Semua kelas</option>
          <option value="dosen">Cari dosen</option>
          <option value="conflict">Cek bentrok dosen</option>
        </select>
      </div>

      <div>
        <label>Nama Dosen</label>
        <select id="dosenSelect" disabled>
          <option value="">Pilih dosen</option>
        </select>
      </div>

      <div>
        <label>Kode Kelas</label>
        <select id="classSelect" disabled>
          <option value="">Pilih kelas</option>
        </select>
      </div>

      <div>
        <label>Tampilan Nama Dosen</label>
        <select id="nameMode" disabled>
          <option value="full">Nama lengkap</option>
          <option value="short">Nama sesuai Excel</option>
        </select>
      </div>
    </div>

    <div class="button-row">
      <button id="showButton" disabled>Tampilkan Jadwal</button>
      <button id="downloadButton" class="download" disabled>Download Excel</button>
    </div>

    <div id="classStatus"></div>
  </div>

  <div id="result"></div>
</div>

function mkFullName(name){
  const raw=clean(name);
  if(!raw) return '';
  if(MK_MASTER[raw]) return MK_MASTER[raw];

  const upper=raw.toUpperCase();
  const key=Object.keys(MK_MASTER).find(k=>k.toUpperCase()===upper);
  return key ? MK_MASTER[key] : raw;
}

function normalizeCourseKey(v){
  return clean(v).toLowerCase()
    .replace(/\s+/g,' ')
    .replace(/[‐‑–—]/g,'-')
    .trim();
}

const SKS_MASTER_NORMALIZED=Object.fromEntries(
  Object.entries(SKS_MASTER).map(([k,v])=>[normalizeCourseKey(k),v])
);

function getSks(courseName){
  const full=mkFullName(courseName);
  const key=normalizeCourseKey(full);
  return Object.prototype.hasOwnProperty.call(SKS_MASTER_NORMALIZED,key)
    ? SKS_MASTER_NORMALIZED[key]
    : '';
}

  const short=clean(name);
  const full=mkFullName(short);

  if(full && normalize(full)!==normalize(short)){
    return `<div class="mk-full"><b>${escapeHtml(full)}</b></div>
            <div class="mk-code">Nama di Excel: ${escapeHtml(short)}</div>`;
  }

  return `<div class="mk-full"><b>${escapeHtml(full || short)}</b></div>`;
}

function clean(v){
  if(v===null || v===undefined) return '';
  return String(v).replace(/\s+/g,' ').trim();
}

function escapeHtml(v){
  return clean(v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function normalize(v){
  return clean(v).toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
}

function normalizeCode(v){
  return clean(v).replace(/\s+/g,' ');
}

function teacherFullName(code){
  const key=normalize(code);
  if(DOSEN_MASTER[key]) return DOSEN_MASTER[key];
  if(DOSEN_ALIAS[key]) return DOSEN_ALIAS[key];
  return clean(code);
}

function teacherSearchText(code){
  const short=normalize(code);
  const full=normalize(teacherFullName(code));
  return short+' '+full;
}

function regFromSheet(sheet){
  const s=sheet.toLowerCase().trim();
  if(s==='reg a') return 'Reg A';
  if(s==='reg b') return 'Reg B';
  if(s==='reg cs' || s==='reg c') return 'Reg C';
  return null;
}

function isClassCode(v){
  const s=normalizeCode(v).toUpperCase();
  return /AKS[A-Z]/.test(s) && /\d/.test(s);
}

function headerIsRoom(data,col){
  for(let r=0;r<Math.min(data.length,10);r++){
    const v=clean(data[r]?.[col]);
    if(/^ruangan?$|^ruang$/i.test(v)) return true;
  }
  return false;
}

function getClassColumns(data){
  const cols=[];
  const seen=new Set();

  for(let r=0;r<Math.min(data.length,12);r++){
    for(let c=0;c<(data[r]?.length||0);c++){
      const value=data[r][c];
      if(isClassCode(value)){
        const code=normalizeCode(value);
        const key=code.toUpperCase();

        if(!seen.has(key)){
          seen.add(key);
          cols.push({
            col:c,
            code,
            roomCol:headerIsRoom(data,c+1)?c+1:null
          });
        }
      }
    }
  }
  return cols;
}

function findDayMarkers(data){
  const markers=[];
  const dayWords=/^(senin|selasa|rabu|kamis|jum'?at|sabtu|minggu)$/i;

  for(let r=0;r<data.length;r++){
    for(let c=0;c<Math.min(3,data[r]?.length||0);c++){
      const v=clean(data[r][c]);
      if(dayWords.test(v)) markers.push({row:r,day:v});
    }
  }
  return markers;
}

function findRegCMarkers(data){
  const markers=[];
  for(let r=0;r<data.length;r++){
    const v=clean(data[r]?.[1]);
    if(/^CS\s*\(/i.test(v)) markers.push({row:r,day:v});
  }
  return markers;
}

function getTimeMap(data){
  const map={};
  const timeRe=/\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}/;

  for(const row of data){
    for(let c=0;c<row.length;c++){
      const v=clean(row[c]);
      const m=v.match(timeRe);

      if(m){
        let jam='';
        for(let k=Math.max(0,c-3);k<=c;k++){
          const x=clean(row[k]);
          if(/^\d+(\.0)?$/.test(x)) jam=String(parseInt(x,10));
        }
        if(jam) map[jam]=m[0].replace(/\s+/g,' ');
      }
    }
  }
  return map;
}

function getSlotRows(data){
  const rows=[];

  for(let r=0;r<data.length;r++){
    const v=clean(data[r]?.[2]);

    if(/^\d+(\.0)?$/.test(v)){
      const n=parseInt(v,10);
      if(n>=1 && n<=10) rows.push({row:r,slot:n});
    }
  }
  return rows;
}

function assignDayForBlocks(data,slotRows,reg){
  const result=[];
  const markers=reg==='Reg C' ? findRegCMarkers(data) : findDayMarkers(data);

  const starts=slotRows.filter(x=>x.slot===1).map(x=>x.row);

  for(let i=0;i<starts.length;i++){
    const start=starts[i];
    const end=i+1<starts.length ? starts[i+1]-1 : data.length-1;

    let day='';
    const inside=markers.filter(m=>m.row>=start && m.row<=end);

    if(inside.length) day=inside[0].day;

    if(!day){
      const before=markers
        .filter(m=>m.row<start)
        .sort((a,b)=>b.row-a.row)[0];

      if(before) day=before.day;
    }

    for(const s of slotRows.filter(x=>x.row>=start && x.row<=end)){
      result.push({...s,day});
    }
  }

  return result;
}

function extractSheet(sheet,reg){
  const ws=workbook.Sheets[sheet];
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
  const classCols=getClassColumns(data);

  if(!classCols.length) return [];

  const slotRows=getSlotRows(data);
  const blocks=assignDayForBlocks(data,slotRows,reg);
  const timeMap=getTimeMap(data);
  const records=[];

  for(const cls of classCols){
    for(const block of blocks){
      const r=block.row;

      const teacher=clean(data[r]?.[cls.col]);
      const subject=clean(data[r+1]?.[cls.col]);
      const room=cls.roomCol!==null ? clean(data[r]?.[cls.roomCol]) : '';

      if(!teacher && !subject && !room) continue;

      if(!subject ||
         /^\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}$/.test(subject)) continue;

      records.push({
        reg,
        sheet,
        kodeKelas:cls.code,
        no:records.filter(x=>x.reg===reg && x.kodeKelas===cls.code).length+1,
        mataKuliah:subject,
        sks:getSks(subject),
        ruang:room,
        hari:block.day,
        jamKe:block.slot,
        waktu:timeMap[String(block.slot)] || '',
        dosen:teacher
      });
    }
  }

  return records;
}

function loadAllData(){
  allRecords=[];

  for(const sheet of workbook.SheetNames){
    const reg=regFromSheet(sheet);
    if(!reg) continue;
    allRecords.push(...extractSheet(sheet,reg));
  }

  const seen=new Set();

  allRecords=allRecords.filter(x=>{
    const key=[
      x.reg,x.kodeKelas,x.hari,x.jamKe,
      x.mataKuliah,x.dosen,x.ruang
    ].join('|').toUpperCase();

    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  populateReg();
}

const DAY_ORDER={
  "senin":1,
  "selasa":2,
  "rabu":3,
  "kamis":4,
  "jumat":5,
  "jum'at":5,
  "sabtu":6,
  "minggu":7
};

function dayOrder(value){
  const key=clean(value).toLowerCase().replace(/\s+/g,'');
  return DAY_ORDER[key] || 99;
}

function timeToMinutes(value){
  const m=clean(value).match(/(\d{1,2})[.:](\d{2})/);
  if(!m) return 99999;
  return Number(m[1])*60+Number(m[2]);
}

function sortRecords(records){
  const regOrder={'Reg A':1,'Reg B':2,'Reg C':3};

  return [...records].sort((a,b)=>{
    // Jika beberapa reguler ditampilkan sekaligus, kelompokkan reguler dulu.
    const regCmp=(regOrder[a.reg]||9)-(regOrder[b.reg]||9);
    if(regCmp!==0) return regCmp;

    // Dalam setiap reguler, kelompokkan berdasarkan KODE KELAS.
    const classCmp=String(a.kodeKelas||'').localeCompare(
      String(b.kodeKelas||''),
      undefined,
      {numeric:true,sensitivity:'base'}
    );
    if(classCmp!==0) return classCmp;

    // WAJIB: Senin -> Selasa -> Rabu -> Kamis -> Jumat -> Sabtu -> Minggu.
    const dayCmp=dayOrder(a.hari)-dayOrder(b.hari);
    if(dayCmp!==0) return dayCmp;

    // Kalau harinya sama: waktu paling pagi -> paling siang.
    const timeCmp=timeToMinutes(a.waktu)-timeToMinutes(b.waktu);
    if(timeCmp!==0) return timeCmp;

    // Jika waktu kosong/sama, gunakan JAM KE sebagai tie-breaker.
    return (Number(a.jamKe)||999)-(Number(b.jamKe)||999);
  });
}

function sortClassRows(records){
  return [...records].sort((a,b)=>{
    const dayCmp=dayOrder(a.hari)-dayOrder(b.hari);
    if(dayCmp!==0) return dayCmp;

    const timeCmp=timeToMinutes(a.waktu)-timeToMinutes(b.waktu);
    if(timeCmp!==0) return timeCmp;

    return (Number(a.jamKe)||999)-(Number(b.jamKe)||999);
  });
}

function timeRange(value){
  const m=clean(value).match(/(\d{1,2})[.:](\d{2})\s*[-–]\s*(\d{1,2})[.:](\d{2})/);
  if(!m) return null;

  return {
    start:Number(m[1])*60+Number(m[2]),
    end:Number(m[3])*60+Number(m[4])
  };
}

function canonicalTeacher(code){
  const raw=clean(code);
  if(!raw) return '';

  const full=teacherFullName(raw);
  return normalize(full || raw);
}

function detectDosenConflicts(records){
  const sorted=sortRecords(records);
  const byTeacher={};

  sorted.forEach(r=>{
    const teacherKey=canonicalTeacher(r.dosen);
    if(!teacherKey) return;

    if(!byTeacher[teacherKey]) byTeacher[teacherKey]=[];
    byTeacher[teacherKey].push(r);
  });

  const conflicts=[];

  Object.keys(byTeacher).forEach(teacherKey=>{
    const rows=byTeacher[teacherKey];

    for(let i=0;i<rows.length;i++){
      for(let j=i+1;j<rows.length;j++){
        const a=rows[i];
        const b=rows[j];

        if(dayOrder(a.hari)!==dayOrder(b.hari)) continue;

        // Jangan anggap dua baris dari kelas yang sama sebagai bentrok.
        // Yang dicari adalah satu dosen masuk di dua kelas berbeda.
        if(a.reg===b.reg && a.kodeKelas===b.kodeKelas) continue;

        const ta=timeRange(a.waktu);
        const tb=timeRange(b.waktu);

        let overlap=false;

        if(ta && tb){
          overlap=ta.start < tb.end && tb.start < ta.end;
        }else{
          // Jika waktu tidak tersedia, fallback ke JAM KE.
          overlap=String(a.jamKe)===String(b.jamKe);
        }

        if(!overlap) continue;

        conflicts.push({
          teacherKey,
          teacher:teacherFullName(a.dosen || b.dosen),
          hari:a.hari || b.hari,
          waktu:a.waktu || b.waktu || '-',
          rows:[a,b]
        });
      }
    }
  });

  return conflicts.sort((a,b)=>{
    const teacherCmp=a.teacher.localeCompare(b.teacher,'id',{sensitivity:'base'});
    if(teacherCmp!==0) return teacherCmp;
    const dayCmp=dayOrder(a.hari)-dayOrder(b.hari);
    if(dayCmp!==0) return dayCmp;
    return timeToMinutes(a.waktu)-timeToMinutes(b.waktu);
  });
}

function displayConflicts(){
  const records=filteredByReg();
  const conflicts=detectDosenConflicts(records);
  displayedRecords=records;

  if(!conflicts.length){
    result.innerHTML=`
      <div class="card">
        <h2>Tidak Ada Bentrok Dosen</h2>
        <div class="success">
          Tidak ditemukan dosen yang mengajar dua kelas berbeda pada hari dan waktu yang sama.
        </div>
      </div>`;
    downloadButton.disabled=false;
    return;
  }

  const uniqueTeachers=new Set(conflicts.map(x=>x.teacherKey));

  let html=`
  <div class="card">
    <div class="toolbar">
      <div>
        <h2>Pelacakan Bentrok Dosen</h2>
        <div class="small">
          Ditemukan <b>${conflicts.length}</b> bentrok pada
          <b>${uniqueTeachers.size}</b> dosen.
          Sistem membandingkan hari + jam dan mendeteksi waktu yang saling overlap.
        </div>
      </div>
      <span class="badge conflict-badge">PERLU DICEK</span>
    </div>
  </div>`;

  conflicts.forEach((conflict,index)=>{
    const a=conflict.rows[0];
    const b=conflict.rows[1];

    html+=`
    <div class="conflict-card">
      <div class="conflict-title">
        <div>
          <h3>${escapeHtml(conflict.teacher)}</h3>
          <div class="conflict-meta">
            Bentrok #${index+1} • ${escapeHtml(conflict.hari)} • ${escapeHtml(conflict.waktu || '-')} 
          </div>
        </div>
        <span class="badge conflict-badge">BENTROK</span>
      </div>

      <div class="table-wrap">
        <table class="conflict-table">
          <thead>
            <tr>
              <th>REG</th>
              <th>KODE KELAS</th>
              <th>MATA KULIAH LENGKAP</th>
              <th>HARI</th>
              <th>JAM KE</th>
              <th>WAKTU</th>
              <th>RUANG</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="center">${escapeHtml(a.reg)}</td>
              <td><b>${escapeHtml(a.kodeKelas)}</b></td>
              <td>${escapeHtml(a.mataKuliah)}</td>
              <td>${escapeHtml(a.hari)}</td>
              <td class="center">${escapeHtml(a.jamKe)}</td>
              <td>${escapeHtml(a.waktu || '-')}</td>
              <td>${escapeHtml(a.ruang || '-')}</td>
            </tr>
            <tr>
              <td class="center">${escapeHtml(b.reg)}</td>
              <td><b>${escapeHtml(b.kodeKelas)}</b></td>
              <td>${escapeHtml(b.mataKuliah)}</td>
              <td>${escapeHtml(b.hari)}</td>
              <td class="center">${escapeHtml(b.jamKe)}</td>
              <td>${escapeHtml(b.waktu || '-')}</td>
              <td>${escapeHtml(b.ruang || '-')}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>`;
  });

  result.innerHTML=html;
  downloadButton.disabled=true;
}

function showData(){
  if(modeSelect.value==='dosen'){
    displayDosen();
    return;
  }

  if(modeSelect.value==='conflict'){
    displayConflicts();
    return;
  }

  let records=filteredByReg();

  if(modeSelect.value==='single' && classSelect.value!=='ALL'){
    records=records.filter(x=>x.kodeKelas===classSelect.value);
  }

  displayNormal(records);
}

/* =========================================================
   DOWNLOAD EXCEL
   - Reg A = 1 sheet
   - Reg B = 1 sheet
   - Reg C/CS = 1 sheet
   - Setiap kelas menjadi tabel TERPISAH dalam sheet.
   - Judul kelas bold.
   - Header tabel bold + background.
   - Freeze panes.
   - Auto filter/table Excel.
   - Nama dosen mengikuti pilihan Nama Lengkap / Sesuai Excel.
   ========================================================= */
async function downloadExcel(){
  if(!displayedRecords.length) return;

  downloadButton.disabled=true;
  downloadButton.textContent='Membuat Excel...';

  try{
    const out=new ExcelJS.Workbook();

    out.creator='Pengolah Jadwal Prodi Akuntansi';
    out.title='Jadwal Prodi Akuntansi';
    out.subject='Jadwal Perkuliahan';
    out.created=new Date();

    const groups={
      'Reg A':[],
      'Reg B':[],
      'Reg C':[]
    };

    displayedRecords.forEach(r=>{
      if(groups[r.reg]) groups[r.reg].push(r);
    });

    const widths=[8,32,8,16,22,9,20,30];
    const headers=[
      'NO',
      'MATA KULIAH',
      'SKS',
      'RUANG',
      'HARI / KETERANGAN',
      'JAM KE',
      'WAKTU',
      'DOSEN PENGAMPU'
    ];

    for(const reg of ['Reg A','Reg B','Reg C']){
      const list=groups[reg];
      if(!list.length) continue;

      const sheetName=
        reg==='Reg C' ? 'Reg C-CS' : reg;

      const ws=out.addWorksheet(sheetName);

      ws.views=[{showGridLines:false}];
      ws.freezePanes={ySplit:3};

      ws.pageSetup={
        orientation:'landscape',
        fitToPage:true,
        fitToWidth:1,
        fitToHeight:0,
        paperSize:ws.PAPERSIZE_A4
      };

      ws.pageSetup.margins={
        left:0.25,right:0.25,top:0.5,bottom:0.5,
        header:0.2,footer:0.2
      };

      widths.forEach((w,i)=>{
        ws.getColumn(i+1).width=w;
      });

      const classes=[...new Set(list.map(x=>x.kodeKelas))].sort(
        (a,b)=>a.localeCompare(b,undefined,{numeric:true})
      );

      let row=1;

      classes.forEach((code,classIndex)=>{
        const classRows=list.filter(x=>x.kodeKelas===code);

        /* Judul */
        ws.mergeCells(row,1,row,8);
        const title=ws.getCell(row,1);

        title.value=
          `${reg.toUpperCase()} ${code}`;

        title.font={
          name:'Arial',
          size:16,
          bold:true
        };

        title.alignment={
          horizontal:'center',
          vertical:'middle'
        };

        title.fill={
          type:'pattern',
          pattern:'solid',
          fgColor:{argb:'E2E8F0'}
        };

        title.border={
          top:{style:'medium',color:{argb:'111827'}},
          left:{style:'medium',color:{argb:'111827'}},
          bottom:{style:'medium',color:{argb:'111827'}},
          right:{style:'medium',color:{argb:'111827'}}
        };

        ws.getRow(row).height=28;
        row++;

        /* Semester otomatis dari dua digit awal kode */
        const semesterMatch=String(code).match(/^(\\d{2})/);
        const semester=semesterMatch
          ? parseInt(semesterMatch[1],10)
          : '';

        ws.mergeCells(row,1,row,8);

        const sub=ws.getCell(row,1);
        sub.value=
          semester
          ? `Semester ${semester} • ${classRows.length} mata kuliah • Nama MK & SKS sudah dinormalisasi`
          : `${classRows.length} mata kuliah • Nama MK & SKS sudah dinormalisasi`;

        sub.font={
          name:'Arial',
          size:10,
          italic:true,
          color:{argb:'64748B'}
        };

        sub.alignment={
          horizontal:'center',
          vertical:'middle'
        };

        ws.getRow(row).height=20;
        row++;

        /* Data tabel */
        const startTableRow=row;

        const values=classRows.map((x,i)=>[
          i+1,
          mkFullName(x.mataKuliah),
          getSks(x.mataKuliah),
          x.ruang,
          x.hari,
          x.jamKe,
          x.waktu,
          teacherDisplay(x.dosen)
        ]);

        ws.addTable({
          name:`T${reg.replace(/\\W/g,'')}${classIndex+1}${Date.now()%100000}`,
          ref:`A${startTableRow}:H${startTableRow+values.length}`,
          headerRow:true,
          totalsRow:false,
          style:{
            theme:'TableStyleMedium2',
            showFirstColumn:false,
            showLastColumn:false,
            showRowStripes:true,
            showColumnStripes:false
          },
          columns:headers.map(h=>({name:h})),
          rows:values
        });

        /* Styling header */
        for(let c=1;c<=8;c++){
          const cell=ws.getCell(startTableRow,c);

          cell.font={
            name:'Arial',
            size:10,
            bold:true,
            color:{argb:'FFFFFF'}
          };

          cell.alignment={
            horizontal:'center',
            vertical:'middle',
            wrapText:true
          };
        }

        /* Styling data */
        for(let r=startTableRow+1;r<=startTableRow+values.length;r++){
          for(let c=1;c<=8;c++){
            const cell=ws.getCell(r,c);

            cell.font={
              name:'Arial',
              size:10
            };

            cell.alignment={
              vertical:'middle',
              wrapText:true
            };

            if([1,3,6].includes(c)){
              cell.alignment.horizontal='center';
            }
          }

          ws.getRow(r).height=22;
        }

        row=startTableRow+values.length+3;
      });
    }

    const safeReg=
      regSelect.value==='ALL'
      ? 'SEMUA_REG'
      : regSelect.value.replace(/\\s+/g,'_');

    const modePart=
      modeSelect.value==='dosen'
      ? 'DOSEN'
      : modeSelect.value==='all'
        ? 'SEMUA_KELAS'
        : (classSelect.value||'KELAS');

    const namePart=
      nameMode.value==='full'
      ? 'NAMA_LENGKAP'
      : 'NAMA_EXCEL';

    await out.xlsx.writeBuffer().then(buffer=>{
      const blob=new Blob(
        [buffer],
        {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}
      );

      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');

      a.href=url;
      a.download=`Jadwal_${safeReg}_${modePart}_${namePart}.xlsx`;

      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    });

    classStatus.innerHTML=
      '<div class="success">Excel berhasil dibuat dengan tabel terpisah per kelas.</div>';

  }catch(err){
    console.error(err);

    classStatus.innerHTML=
      `<div class="error">Gagal membuat Excel: ${escapeHtml(err.message||err)}</div>`;
  }finally{
    downloadButton.disabled=false;
    downloadButton.textContent='Download Excel';
  }
}

   EVENT
   ========================================================= */
excelFile.addEventListener('change',function(e){
  const file=e.target.files[0];
  if(!file) return;

  fileStatus.innerHTML=
    '<div class="info">Sedang membaca file Excel...</div>';

  const reader=new FileReader();

  reader.onload=function(event){
    try{
      workbook=XLSX.read(
        new Uint8Array(event.target.result),
        {type:'array',cellDates:true}
      );

      loadAllData();

      const sheets=workbook.SheetNames.filter(s=>regFromSheet(s));

      const countA=allRecords.filter(x=>x.reg==='Reg A').length;
      const countB=allRecords.filter(x=>x.reg==='Reg B').length;
      const countC=allRecords.filter(x=>x.reg==='Reg C').length;

      fileStatus.innerHTML=`
        <div class="success">
          File berhasil dibaca.
          Sheet jadwal: <b>${sheets.join(', ')}</b>.
          Total <b>${allRecords.length}</b> baris jadwal.
          <br>
          Reg A: <b>${countA}</b> •
          Reg B: <b>${countB}</b> •
          Reg C/CS: <b>${countC}</b>
        </div>`;

      showButton.disabled=false;

    }catch(err){
      console.error(err);

      fileStatus.innerHTML=
        '<div class="error">File Excel gagal dibaca. Coba upload ulang file .xlsx.</div>';
    }
  };

  reader.readAsArrayBuffer(file);
});

regSelect.addEventListener('change',function(){
  populateClasses();
  populateDosen();
  updateControls();
  result.innerHTML='';
  downloadButton.disabled=true;
});

modeSelect.addEventListener('change',function(){
  updateControls();
  result.innerHTML='';
  downloadButton.disabled=true;
});

nameMode.addEventListener('change',function(){
  if(displayedRecords.length){
    if(modeSelect.value==='dosen'){
      displayDosen();
    }else{
      showData();
    }
  }
});

showButton.addEventListener('click',showData);
downloadButton.addEventListener('click',downloadExcel);
</script>
