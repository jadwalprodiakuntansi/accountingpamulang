<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengolah Jadwal Prodi Akuntansi</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f9;
    color: #111827;
}

.header {
    background: #111827;
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.header h1 {
    margin: 0;
    font-size: 34px;
}

.header p {
    margin-top: 12px;
    font-size: 20px;
    color: #d1d5db;
}

.container {
    max-width: 1450px;
    margin: 40px auto;
    padding: 0 20px;
}

.card {
    background: white;
    padding: 30px;
    margin-bottom: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input,
select,
button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    font-size: 16px;
}

select {
    background: white;
}

button {
    background: #111827;
    color: white;
    font-weight: bold;
    cursor: pointer;
    border: none;
}

button:hover {
    background: #1f2937;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.success {
    background: #dcfce7;
    color: #166534;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
}

.table-card {
    overflow-x: auto;
}

.jadwal-title {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 25px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
}

th {
    background: #111827;
    color: white;
    padding: 18px;
    text-align: center;
}

td {
    padding: 17px;
    border: 1px solid #d1d5db;
}

td:first-child {
    text-align: center;
    width: 70px;
}

.no-data {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

@media(max-width: 800px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>Pengolah Jadwal Prodi Akuntansi</h1>
    <p>Otomatis mengolah data kelas, mata kuliah, dan dosen</p>
</div>

<div class="container">

    <!-- UPLOAD -->
    <div class="card">

        <h2>1. Upload File Excel</h2>

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
        >

        <div id="fileStatus"></div>

    </div>


    <!-- PILIH KELAS -->
    <div class="card">

        <h2>2. Pilih Kelas</h2>

        <div class="grid">

            <div>
                <label>Sheet</label>

                <select id="sheetSelect">
                    <option value="">Pilih sheet</option>
                </select>
            </div>

            <div>
                <label>Kode Kelas</label>

                <select id="classSelect">
                    <option value="">Pilih kode kelas</option>
                </select>
            </div>

        </div>

        <br>

        <button id="showButton">
            Tampilkan Jadwal
        </button>

        <div id="classStatus"></div>

    </div>


    <!-- HASIL -->
    <div id="result"></div>

</div>


<script>

let workbook = null;
let currentSheetData = [];
let currentCodes = [];


// =====================================================
// UPLOAD EXCEL
// =====================================================

document.getElementById("excelFile").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {

        try {

            const data = new Uint8Array(event.target.result);

            workbook = XLSX.read(data, {
                type: "array",
                cellDates: true
            });

            const sheetSelect =
                document.getElementById("sheetSelect");

            sheetSelect.innerHTML =
                '<option value="">Pilih sheet</option>';

            workbook.SheetNames.forEach(function(sheetName) {

                const option =
                    document.createElement("option");

                option.value = sheetName;
                option.textContent = sheetName;

                sheetSelect.appendChild(option);

            });

            document.getElementById("fileStatus").innerHTML =
                '<div class="success">File berhasil dibaca. Pilih sheet untuk melanjutkan.</div>';

        } catch (error) {

            document.getElementById("fileStatus").innerHTML =
                '<div class="error">File Excel gagal dibaca.</div>';

            console.error(error);
        }

    };

    reader.readAsArrayBuffer(file);

});


// =====================================================
// PILIH SHEET
// =====================================================

document.getElementById("sheetSelect").addEventListener("change", function() {

    const sheetName = this.value;

    const classSelect =
        document.getElementById("classSelect");

    classSelect.innerHTML =
        '<option value="">Pilih kode kelas</option>';

    document.getElementById("classStatus").innerHTML = "";

    if (!sheetName || !workbook) return;


    const worksheet =
        workbook.Sheets[sheetName];


    /*
        IMPORTANT:

        Header=1 membuat kita mendapatkan
        ARRAY BARIS MURNI.

        Jadi tidak tergantung nama kolom
        dan tidak terganggu oleh merged cell.
    */

    currentSheetData =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header: 1,
                defval: "",
                raw: false
            }
        );


    currentCodes =
        findClassCodes(currentSheetData);


    currentCodes.forEach(function(code) {

        const option =
            document.createElement("option");

        option.value = code;
        option.textContent = code;

        classSelect.appendChild(option);

    });


    document.getElementById("classStatus").innerHTML =
        '<div class="success">' +
        currentCodes.length +
        ' kode kelas ditemukan.' +
        '</div>';

});


// =====================================================
// CARI KODE KELAS
// =====================================================

function findClassCodes(rows) {

    const codes = [];

    /*
       Format kode yang kita cari:

       01AKSP001
       01AKSP002
       02AKSP001
       dst.

       Jadi bukan mengambil semua angka,
       tetapi harus ada pola:
       01AKSP001
    */

    const regex = /\b\d{2}AKSP\d{3}\b/gi;


    rows.forEach(function(row) {

        row.forEach(function(cell) {

            if (cell === null || cell === undefined) {
                return;
            }

            const text =
                String(cell).trim();

            const matches =
                text.match(regex);

            if (matches) {

                matches.forEach(function(code) {

                    code = code.toUpperCase();

                    if (!codes.includes(code)) {
                        codes.push(code);
                    }

                });

            }

        });

    });


    return codes;
}


// =====================================================
// TAMPILKAN JADWAL
// =====================================================

document.getElementById("showButton").addEventListener("click", function() {

    const code =
        document.getElementById("classSelect").value;

    if (!code) {

        document.getElementById("classStatus").innerHTML =
            '<div class="error">Silakan pilih kode kelas terlebih dahulu.</div>';

        return;
    }


    const result =
        parseClassSchedule(
            currentSheetData,
            code
        );


    if (!result) {

        document.getElementById("classStatus").innerHTML =
            '<div class="error">' +
            'Kode kelas ' +
            code +
            ' tidak ditemukan di sheet ini.' +
            '</div>';

        document.getElementById("result").innerHTML = "";

        return;
    }


    document.getElementById("classStatus").innerHTML =
        '<div class="success">' +
        result.data.length +
        ' mata kuliah ditemukan untuk kelas ' +
        code +
        '.</div>';


    displaySchedule(code, result.data);

});


// =====================================================
// PARSER UTAMA
// =====================================================

function parseClassSchedule(rows, code) {

    const targetCode =
        code.toUpperCase();


    // -----------------------------------------------
    // 1. CARI BARIS JUDUL KELAS
    // -----------------------------------------------

    let titleRow = -1;


    for (let i = 0; i < rows.length; i++) {

        const rowText =
            rows[i]
                .map(x => String(x))
                .join(" ")
                .toUpperCase();


        if (rowText.includes(targetCode)) {

            titleRow = i;
            break;

        }

    }


    if (titleRow === -1) {
        return null;
    }


    // -----------------------------------------------
    // 2. CARI BARIS HEADER
    // -----------------------------------------------

    let headerRow = -1;


    for (
        let i = titleRow + 1;
        i < Math.min(titleRow + 8, rows.length);
        i++
    ) {

        const text =
            rows[i]
                .map(x => String(x).trim().toUpperCase());


        const hasNo =
            text.includes("NO");

        const hasMataKuliah =
            text.some(x =>
                x.includes("MATA KULIAH")
            );

        if (hasNo && hasMataKuliah) {

            headerRow = i;
            break;

        }

    }


    if (headerRow === -1) {

        /*
           Kalau header tidak ketemu,
           tetap coba asumsi:

           title
           header
           data
        */

        headerRow = titleRow + 1;

    }


    // -----------------------------------------------
    // 3. TENTUKAN POSISI KOLOM
    // -----------------------------------------------

    const header =
        rows[headerRow].map(x =>
            String(x)
                .trim()
                .toUpperCase()
        );


    let noCol =
        header.findIndex(x => x === "NO");

    let mataCol =
        header.findIndex(x =>
            x.includes("MATA KULIAH")
        );

    let sksCol =
        header.findIndex(x =>
            x === "SKS"
        );

    let ruangCol =
        header.findIndex(x =>
            x === "RUANG"
        );

    let hariCol =
        header.findIndex(x =>
            x === "HARI"
        );

    let waktuCol =
        header.findIndex(x =>
            x === "WAKTU"
        );

    let dosenCol =
        header.findIndex(x =>
            x.includes("DOSEN")
        );


    /*
       Kalau header terbaca normal,
       posisi kolomnya akan:

       NO       = 0
       MATA     = 1
       SKS      = 2
       RUANG    = 3
       HARI     = 4
       WAKTU    = 5
       DOSEN    = 6
    */

    if (noCol === -1) noCol = 0;
    if (mataCol === -1) mataCol = 1;
    if (sksCol === -1) sksCol = 2;
    if (ruangCol === -1) ruangCol = 3;
    if (hariCol === -1) hariCol = 4;
    if (waktuCol === -1) waktuCol = 5;
    if (dosenCol === -1) dosenCol = 6;


    // -----------------------------------------------
    // 4. BACA DATA
    // -----------------------------------------------

    const data = [];


    for (
        let i = headerRow + 1;
        i < rows.length;
        i++
    ) {

        const row =
            rows[i];


        // -------------------------------------------
        // CEK APAKAH SUDAH MASUK KELAS BERIKUTNYA
        // -------------------------------------------

        const rowText =
            row
                .map(x => String(x))
                .join(" ")
                .toUpperCase();


        const nextCode =
            rowText.match(/\b\d{2}AKSP\d{3}\b/i);


        if (
            nextCode &&
            nextCode[0].toUpperCase() !== targetCode
        ) {
            break;
        }


        // -------------------------------------------
        // INI BAGIAN PALING PENTING
        // -------------------------------------------
        //
        // HANYA BACA BARIS YANG KOLOM NO-NYA
        // MEMANG ANGKA.
        //
        // Jadi:
        //
        // 1 MATEMATIKA
        // 2 PANCASILA
        // ...
        // 8 ECONOMIC
        //
        // MASUK.
        //
        // Tetapi:
        //
        // 08.50 - 10.30
        // 13.00 - 14.40
        //
        // TIDAK MASUK karena kolom NO kosong.
        // -------------------------------------------


        const noValue =
            String(
                row[noCol] ?? ""
            ).trim();


        if (!/^\d+$/.test(noValue)) {

            /*
               Kalau baris benar-benar kosong,
               dan kita sudah mendapatkan data,
               kemungkinan besar blok selesai.
            */

            const adaIsi =
                row.some(x =>
                    String(x).trim() !== ""
                );

            if (!adaIsi && data.length > 0) {
                break;
            }

            continue;
        }


        const nomor =
            parseInt(noValue, 10);


        /*
           Nomor mata kuliah normal.
           Kita batasi supaya nomor seperti
           tanggal / waktu tidak ikut.
        */

        if (
            isNaN(nomor) ||
            nomor < 1 ||
            nomor > 50
        ) {
            continue;
        }


        const mataKuliah =
            cleanValue(row[mataCol]);

        const sks =
            cleanValue(row[sksCol]);

        const ruang =
            cleanValue(row[ruangCol]);

        const hari =
            cleanValue(row[hariCol]);

        const waktu =
            cleanValue(row[waktuCol]);

        const dosen =
            cleanValue(row[dosenCol]);


        /*
           Mata kuliah harus ada.
        */

        if (!mataKuliah) {
            continue;
        }


        /*
           FILTER TAMBAHAN:
           kalau ternyata isi mata kuliah
           adalah jam seperti 08.50 - 10.30,
           JANGAN MASUKKAN.
        */

        if (isTimeValue(mataKuliah)) {
            continue;
        }


        data.push({

            no: nomor,

            mataKuliah: mataKuliah,

            sks: sks,

            ruang: ruang,

            hari: hari,

            waktu: waktu,

            dosen: dosen

        });

    }


    /*
       Urutkan berdasarkan nomor asli.
    */

    data.sort(function(a, b) {
        return a.no - b.no;
    });


    return {
        titleRow,
        headerRow,
        data
    };

}


// =====================================================
// CLEAN VALUE
// =====================================================

function cleanValue(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    return String(value)
        .replace(/\s+/g, " ")
        .trim();

}


// =====================================================
// DETEKSI JAM
// =====================================================

function isTimeValue(text) {

    if (!text) return false;


    /*
       Contoh:

       08.50 - 10.30
       13.00 - 14.40
       07.10 - 08.50
    */

    return /^\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}$/
        .test(text.trim());

}


// =====================================================
// TAMPILKAN JADWAL
// =====================================================

function displaySchedule(code, data) {

    let html = `

        <div class="card table-card">

            <div class="jadwal-title">
                REG A ${code}
            </div>

            <table>

                <thead>

                    <tr>

                        <th>NO</th>

                        <th>MATA KULIAH</th>

                        <th>SKS</th>

                        <th>RUANG</th>

                        <th>HARI</th>

                        <th>WAKTU</th>

                        <th>DOSEN PENGAMPU</th>

                    </tr>

                </thead>

                <tbody>
    `;


    if (data.length === 0) {

        html += `

            <tr>

                <td colspan="7" class="no-data">
                    Tidak ada data mata kuliah.
                </td>

            </tr>

        `;

    } else {

        data.forEach(function(row) {

            html += `

                <tr>

                    <td>${escapeHtml(row.no)}</td>

                    <td>${escapeHtml(row.mataKuliah)}</td>

                    <td>${escapeHtml(row.sks)}</td>

                    <td>${escapeHtml(row.ruang)}</td>

                    <td>${escapeHtml(row.hari)}</td>

                    <td>${escapeHtml(row.waktu)}</td>

                    <td>${escapeHtml(row.dosen)}</td>

                </tr>

            `;

        });

    }


    html += `

                </tbody>

            </table>

        </div>

    `;


    document.getElementById("result").innerHTML =
        html;

}


// =====================================================
// ANTI HTML INJECTION
// =====================================================

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
