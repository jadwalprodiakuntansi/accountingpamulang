/* =========================================================
   ALIAS DOSEN
   ========================================================= */

const DOSEN_ALIAS = {

  "EUIS":"",

  "YULI":
    "Yuliyanti, S.Pd., M.Pd",

  "EKO":
    "Eko Pujiyono, S.E., M.Ak.",

  "INGGA":

  "IRIN":

  "ARIFATUN":
    "Arifatun Nasihah, S.Ak., M.Ak.",

  "RAHADIAN":
    "Rahadian Amrullah, S.Pd., M.Ak",

  "AKBAR":"",

  "SALMA":""
};


/* =========================================================
   HELPER
   ========================================================= */

function clean(v){

  if(v===null || v===undefined){
    return '';
  }

  return String(v)
    .replace(/\s+/g,' ')
    .trim();
}


function escapeHtml(v){

  return clean(v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function normalize(v){

  return clean(v)
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g,' ')
    .trim();

}


function normalizeCode(v){

  return clean(v)
    .replace(/\s+/g,' ');

}


/* =========================================================
   NAMA DOSEN
   ========================================================= */

function teacherFullName(code){

  const key = normalize(code);

  if(DOSEN_MASTER[key]){
    return DOSEN_MASTER[key];
  }

  if(DOSEN_ALIAS[key]){
    return DOSEN_ALIAS[key];
  }

  return clean(code);
}


function teacherSearchText(code){

  const short = normalize(code);
  const full = normalize(teacherFullName(code));

  return short + ' ' + full;

}


/* =========================================================
   REGULER
   ========================================================= */

function regFromSheet(sheet){

  const s = sheet.toLowerCase().trim();

  if(s === 'reg a'){
    return 'Reg A';
  }

  if(s === 'reg b'){
    return 'Reg B';
  }

  if(s === 'reg cs' || s === 'reg c'){
    return 'Reg C';
  }

  return null;

}


/* =========================================================
   KODE KELAS
   ========================================================= */

function isClassCode(v){

  const s = normalizeCode(v).toUpperCase();

  return /AKS[A-Z]/.test(s) && /\d/.test(s);

}


/* =========================================================
   CARI KOLOM RUANG
   ========================================================= */

function headerIsRoom(data,col){

  for(
    let r=0;
    r<Math.min(data.length,10);
    r++
  ){

    const v = clean(data[r]?.[col]);

    if(/^ruangan?$|^ruang$/i.test(v)){
      return true;
    }

  }

  return false;

}


/* =========================================================
   CARI KODE KELAS
   ========================================================= */

function getClassColumns(data){

  const cols = [];
  const seen = new Set();

  for(
    let r=0;
    r<Math.min(data.length,12);
    r++
  ){

    for(
      let c=0;
      c<(data[r]?.length||0);
      c++
    ){

      const value = data[r][c];

      if(isClassCode(value)){

        const code = normalizeCode(value);
        const key = code.toUpperCase();

        if(!seen.has(key)){

          seen.add(key);

          cols.push({

            col:c,

            code:code,

            roomCol:
              headerIsRoom(data,c+1)
              ? c+1
              : null

          });

        }

      }

    }

  }

  return cols;

}


/* =========================================================
   CARI HARI
   ========================================================= */

function findDayMarkers(data){

  const markers = [];

  const dayWords =
    /^(senin|selasa|rabu|kamis|jum'?at|sabtu|minggu)$/i;

  for(
    let r=0;
    r<data.length;
    r++
  ){

    for(
      let c=0;
      c<Math.min(3,data[r]?.length||0);
      c++
    ){

      const v = clean(data[r][c]);

      if(dayWords.test(v)){

        markers.push({
          row:r,
          day:v
        });

      }

    }

  }

  return markers;

}


/* =========================================================
   REG C
   ========================================================= */

function findRegCMarkers(data){

  const markers = [];

  for(
    let r=0;
    r<data.length;
    r++
  ){

    const v = clean(data[r]?.[1]);

    if(/^CS\s*\(/i.test(v)){

      markers.push({
        row:r,
        day:v
      });

    }

  }

  return markers;

}


/* =========================================================
   JAM
   ========================================================= */

function getTimeMap(data){

  const map = {};

  const timeRe =
    /\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}/;

  for(const row of data){

    for(
      let c=0;
      c<row.length;
      c++
    ){

      const v = clean(row[c]);

      const m = v.match(timeRe);

      if(m){

        let jam = '';

        for(
          let k=Math.max(0,c-3);
          k<=c;
          k++
        ){

          const x = clean(row[k]);

          if(/^\d+(\.0)?$/.test(x)){

            jam = String(
              parseInt(x,10)
            );

          }

        }

        if(jam){

          map[jam] =
            m[0].replace(/\s+/g,' ');

        }

      }

    }

  }

  return map;

}


/* =========================================================
   SLOT
   ========================================================= */

function getSlotRows(data){

  const rows = [];

  for(
    let r=0;
    r<data.length;
    r++
  ){

    const v = clean(data[r]?.[2]);

    if(/^\d+(\.0)?$/.test(v)){

      const n = parseInt(v,10);

      if(n>=1 && n<=10){

        rows.push({
          row:r,
          slot:n
        });

      }

    }

  }

  return rows;

}


/* =========================================================
   ASSIGN HARI
   ========================================================= */

function assignDayForBlocks(
  data,
  slotRows,
  reg
){

  const result = [];

  const markers =
    reg==='Reg C'
    ? findRegCMarkers(data)
    : findDayMarkers(data);

  const starts =
    slotRows
      .filter(x=>x.slot===1)
      .map(x=>x.row);

  for(
    let i=0;
    i<starts.length;
    i++
  ){

    const start = starts[i];

    const end =
      i+1<starts.length
      ? starts[i+1]-1
      : data.length-1;

    let day = '';

    const inside =
      markers.filter(
        m=>m.row>=start && m.row<=end
      );

    if(inside.length){

      day = inside[0].day;

    }

    if(!day){

      const before =
        markers
          .filter(m=>m.row<start)
          .sort((a,b)=>b.row-a.row)[0];

      if(before){

        day = before.day;

      }

    }

    for(
      const s of slotRows.filter(
        x=>x.row>=start && x.row<=end
      )
    ){

      result.push({
        ...s,
        day
      });

    }

  }

  return result;

}


/* =========================================================
   EXTRACT SHEET
   ========================================================= */

function extractSheet(sheet,reg){

  const ws = workbook.Sheets[sheet];

  const data =
    XLSX.utils.sheet_to_json(
      ws,
      {
        header:1,
        defval:'',
        raw:false
      }
    );

  const classCols =
    getClassColumns(data);

  if(!classCols.length){
    return [];
  }

  const slotRows =
    getSlotRows(data);

  const blocks =
    assignDayForBlocks(
      data,
      slotRows,
      reg
    );

  const timeMap =
    getTimeMap(data);

  const records = [];

  for(const cls of classCols){

    for(const block of blocks){

      const r = block.row;

      const teacher =
        clean(data[r]?.[cls.col]);

      const subject =
        clean(data[r+1]?.[cls.col]);

      const room =
        cls.roomCol!==null
        ? clean(data[r]?.[cls.roomCol])
        : '';

      if(
        !teacher &&
        !subject &&
        !room
      ){
        continue;
      }

      if(
        !subject ||
        /^\d{1,2}[.:]\d{2}\s*[-–]\s*\d{1,2}[.:]\d{2}$/.test(subject)
      ){
        continue;
      }

      records.push({

        reg,

        sheet,

        kodeKelas:
          cls.code,

        no:
          records.filter(
            x=>
              x.reg===reg &&
              x.kodeKelas===cls.code
          ).length+1,

        mataKuliah:
          subject,

        sks:'',

        ruang:
          room,

        hari:
          block.day,

        jamKe:
          block.slot,

        waktu:
          timeMap[String(block.slot)] || '',

        dosen:
          teacher

      });

    }

  }

  return records;

}


/* =========================================================
   LOAD SEMUA DATA
   ========================================================= */

function loadAllData(){

  allRecords = [];

  for(
    const sheet of workbook.SheetNames
  ){

    const reg =
      regFromSheet(sheet);

    if(!reg){
      continue;
    }

    allRecords.push(
      ...extractSheet(
        sheet,
        reg
      )
    );

  }


  const seen = new Set();

  allRecords =
    allRecords.filter(x=>{

      const key = [

        x.reg,
        x.kodeKelas,
        x.hari,
        x.jamKe,
        x.mataKuliah,
        x.dosen,
        x.ruang

      ].join('|').toUpperCase();


      if(seen.has(key)){
        return false;
      }

      seen.add(key);

      return true;

    });


  populateReg();

}


/* =========================================================
   POPULATE REG
   ========================================================= */

function populateReg(){

  regSelect.innerHTML = '';

  const regs = [
    'ALL',
    'Reg A',
    'Reg B',
    'Reg C'
  ];

  const labels = {

    ALL:
      'Semua Reg (A + B + C)',

    'Reg A':
      'Reg A',

    'Reg B':
      'Reg B',

    'Reg C':
      'Reg C / CS'

  };


  regs.forEach(v=>{

    const o =
      document.createElement('option');

    o.value = v;

    o.textContent =
      labels[v];

    regSelect.appendChild(o);

  });


  regSelect.disabled = false;
  modeSelect.disabled = false;
  nameMode.disabled = false;

  regSelect.value = 'ALL';
  modeSelect.value = 'all';

  populateClasses();
  populateDosen();

  updateControls();

}


/* =========================================================
   FILTER REG
   ========================================================= */

function filteredByReg(){

  const reg =
    regSelect.value;

  return reg==='ALL'
    ? allRecords
    : allRecords.filter(
        x=>x.reg===reg
      );

}


/* =========================================================
   POPULATE CLASS
   ========================================================= */

function populateClasses(){

  const records =
    filteredByReg();

  const codes = [

    ...new Map(
      records.map(
        x=>[
          x.kodeKelas,
          x.kodeKelas
        ]
      )
    ).values()

  ];


  codes.sort(
    (a,b)=>
      a.localeCompare(
        b,
        undefined,
        {
          numeric:true,
          sensitivity:'base'
        }
      )
  );


  classSelect.innerHTML = '';


  const first =
    document.createElement('option');

  first.value = 'ALL';

  first.textContent =
    'Semua Kelas';

  classSelect.appendChild(first);


  codes.forEach(code=>{

    const o =
      document.createElement('option');

    o.value = code;

    o.textContent = code;

    classSelect.appendChild(o);

  });


  classSelect.disabled = false;


  classStatus.innerHTML =

    `<div class="info">
      <b>${codes.length}</b>
      kode kelas tersedia.
    </div>`;

}


/* =========================================================
   POPULATE DOSEN
   ========================================================= */

function populateDosen(){

  const records =
    filteredByReg();

  const codes = [
    ...new Set(
      records
        .map(x=>clean(x.dosen))
        .filter(Boolean)
    )
  ];


  codes.sort(
    (a,b)=>
      teacherFullName(a)
        .localeCompare(
          teacherFullName(b),
          'id',
          {
            sensitivity:'base'
          }
        )
  );


  dosenSelect.innerHTML = '';


  const first =
    document.createElement('option');

  first.value = '';

  first.textContent =
    'Pilih dosen';

  dosenSelect.appendChild(first);


  codes.forEach(code=>{

    const o =
      document.createElement('option');

    o.value = code;


    const full =
      teacherFullName(code);


    if(full!==code){

      o.textContent =
        `${full} [${code}]`;

    }else{

      o.textContent =
        code;

    }


    dosenSelect.appendChild(o);

  });


  dosenSelect.disabled = false;

}


/* =========================================================
   UPDATE CONTROL
   ========================================================= */

function updateControls(){

  const mode =
    modeSelect.value;


  classSelect.disabled =
    mode==='dosen';

  dosenSelect.disabled =
    mode!=='dosen';


  if(mode==='dosen'){

    classStatus.innerHTML =
      '<div class="info">' +
      'Pilih nama dosen untuk melihat ' +
      'semua kelas yang diampu.' +
      '</div>';

  }else{

    const records =
      filteredByReg();

    const count =
      [
        ...new Set(
          records.map(
            x=>x.kodeKelas
          )
        )
      ].length;


    classStatus.innerHTML =
      `<div class="info">
        <b>${count}</b>
        kode kelas tersedia.
      </div>`;

  }

}


/* =========================================================
   SORT
   ========================================================= */

function sortRecords(records){

  const regOrder = {

    'Reg A':1,
    'Reg B':2,
    'Reg C':3

  };


  return [...records].sort(
    (a,b)=>

      (
        regOrder[a.reg]||9
      ) -
      (
        regOrder[b.reg]||9
      )

      ||

      a.kodeKelas.localeCompare(
        b.kodeKelas,
        undefined,
        {
          numeric:true,
          sensitivity:'base'
        }
      )

      ||

      a.hari.localeCompare(
        b.hari,
        'id'
      )

      ||

      a.jamKe-b.jamKe

  );

}


/* =========================================================
   DISPLAY DOSEN
   ========================================================= */

function teacherDisplay(code){

  return nameMode.value==='full'
    ? teacherFullName(code)
    : clean(code);

}


function teacherHtml(code){

  const short =
    clean(code);

  const full =
    teacherFullName(short);

  const shown =
    teacherDisplay(short);


  if(
    nameMode.value==='full' &&
    full!==short
  ){

    return `
      <div class="teacher-name">
        ${escapeHtml(shown)}
      </div>

      <div class="teacher-code">
        Kode: ${escapeHtml(short)}
      </div>
    `;

  }


  return `
    <div class="teacher-name">
      ${escapeHtml(shown)}
    </div>
  `;

}


/* =========================================================
   DISPLAY NORMAL
   =========================================================
   
   INI BAGIAN PENTING:
   1 KELAS = 1 CARD = 1 TABEL
   ========================================================= */

function displayNormal(records){

  displayedRecords =
    sortRecords(records);


  if(!displayedRecords.length){

    result.innerHTML =
      '<div class="card empty">' +
      'Tidak ada data jadwal untuk pilihan tersebut.' +
      '</div>';

    downloadButton.disabled = true;

    return;

  }


  /*
    GROUPING BERDASARKAN REG + KODE KELAS
  */

  const classMap = {};


  displayedRecords.forEach(row=>{

    const key =
      row.reg +
      '|' +
      row.kodeKelas;


    if(!classMap[key]){

      classMap[key] = [];

    }


    classMap[key].push(row);

  });


  /*
    SORT KELAS
  */

  const classKeys =
    Object.keys(classMap)
      .sort((a,b)=>{

        const [regA,codeA] =
          a.split('|');

        const [regB,codeB] =
          b.split('|');


        const regOrder = {

          'Reg A':1,
          'Reg B':2,
          'Reg C':3

        };


        return (

          (regOrder[regA]||9) -
          (regOrder[regB]||9)

        )

        ||

        codeA.localeCompare(
          codeB,
          undefined,
          {
            numeric:true,
            sensitivity:'base'
          }
        );

      });


  let html = '';


  /*
    BUAT 1 TABEL UNTUK SETIAP KELAS
  */

  classKeys.forEach(key=>{

    const rows =
      classMap[key];

    const reg =
      rows[0].reg;

    const code =
      rows[0].kodeKelas;


    /*
      SEMESTER DARI DUA DIGIT AWAL KODE
    */

    const semesterMatch =
      String(code)
        .match(/^(\d{2})/);


    const semester =
      semesterMatch
      ? parseInt(
          semesterMatch[1],
          10
        )
      : '';


    html += `

      <div class="table-card">

        <div class="class-title">

          <h2>
            ${escapeHtml(
              reg.toUpperCase()
            )}
            ${escapeHtml(code)}
          </h2>

          <div class="semester">

            ${
              semester
              ? `Semester ${semester} • `
              : ''
            }

            ${rows.length}
            mata kuliah

            • Tampilan dosen:
            <b>
              ${
                nameMode.value==='full'
                ? 'Nama lengkap'
                : 'sesuai Excel'
              }
            </b>

          </div>

        </div>


        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>NO</th>

                <th>MATA KULIAH</th>

                <th>SKS</th>

                <th>RUANG</th>

                <th>HARI / KETERANGAN</th>

                <th>JAM KE</th>

                <th>WAKTU</th>

                <th>DOSEN PENGAMPU</th>

              </tr>

            </thead>


            <tbody>
    `;


    rows.forEach((row,index)=>{

      html += `

        <tr>

          <td class="center">
            ${index+1}
          </td>

          <td>
            ${escapeHtml(
              row.mataKuliah
            )}
          </td>

          <td class="center">
            ${escapeHtml(
              row.sks
            )}
          </td>

          <td>
            ${escapeHtml(
              row.ruang
            )}
          </td>

          <td>
            ${escapeHtml(
              row.hari
            )}
          </td>

          <td class="center">
            ${escapeHtml(
              row.jamKe
            )}
          </td>

          <td>
            ${escapeHtml(
              row.waktu
            )}
          </td>

          <td>
            ${teacherHtml(
              row.dosen
            )}
          </td>

        </tr>

      `;

    });


    html += `

            </tbody>

          </table>

        </div>

      </div>

    `;

  });


  result.innerHTML =
    html;


  downloadButton.disabled =
    false;

}


/* =========================================================

    downloadButton.disabled = true;

    displayedRecords = [];

    return;

  const target =
    normalize(selected);

    sortRecords(

      filteredByReg()
        .filter(
          x =>
            normalize(x.dosen) ===

        )

    teacherFullName(selected);

  */

  records.forEach(r=>{

              <thead>

                <tr>

                  <th>NO</th>

                  <th>MATA KULIAH</th>

                  <th>HARI</th>

                  <th>JAM KE</th>

                  <th>WAKTU</th>

                  <th>RUANG</th>

              <tbody>

      `;


      rows.forEach((r,i)=>{

        html += `

          <tr>

            <td class="center">
              ${i+1}
            </td>

            <td>
              ${escapeHtml(
                r.mataKuliah
              )}
            </td>

            <td>
              ${escapeHtml(
                r.hari
              )}
            </td>

              ${escapeHtml(
                r.jamKe

            </td>

              ${escapeHtml(
                r.waktu
              )}
            </td>

            <td>
              ${escapeHtml(

      html += `

            </table>

          </div>

        </div>

      `;

    });


  result.innerHTML =

}


/* =========================================================
   SHOW DATA
   ========================================================= */

function showData(){

  if(modeSelect.value==='dosen'){

    displayDosen();

    return;

  }


  let records =
    filteredByReg();


  if(
    modeSelect.value==='single' &&
    classSelect.value!=='ALL'
  ){

    records =
      records.filter(
        x =>
          x.kodeKelas ===
          classSelect.value
      );

  }


  displayNormal(records);

}


/* =========================================================
   DOWNLOAD EXCEL
   =========================================================

   REG A = 1 SHEET
   REG B = 1 SHEET
   REG C = 1 SHEET

   SETIAP KELAS = TABEL TERPISAH
   ========================================================= */

async function downloadExcel(){

  if(!displayedRecords.length){
    return;
  }


  downloadButton.disabled =
    true;

  downloadButton.textContent =
    'Membuat Excel...';


  try{

    const out =
      new ExcelJS.Workbook();


    out.creator =
      'Pengolah Jadwal Prodi Akuntansi';

    out.title =
      'Jadwal Prodi Akuntansi';

    out.subject =
      'Jadwal Perkuliahan';

    out.created =
      new Date();


    const groups = {

      'Reg A':[],
      'Reg B':[],
      'Reg C':[]

    };


    displayedRecords.forEach(r=>{

      if(groups[r.reg]){

        groups[r.reg].push(r);

      }

    });


    const widths = [

      8,
      32,
      8,
      16,
      22,
      9,
      20,
      30

    ];


    const headers = [

      'NO',
      'MATA KULIAH',
      'SKS',
      'RUANG',
      'HARI / KETERANGAN',
      'JAM KE',
      'WAKTU',
      'DOSEN PENGAMPU'

    ];


    for(
      const reg of [
        'Reg A',
        'Reg B',
        'Reg C'
      ]
    ){

      const list =
        groups[reg];


      if(!list.length){
        continue;
      }


      const sheetName =
        reg==='Reg C'
        ? 'Reg C-CS'
        : reg;


      const ws =
        out.addWorksheet(
          sheetName
        );


      ws.views = [
        {
          showGridLines:false
        }
      ];


      ws.freezePanes = {
        ySplit:3
      };


      ws.pageSetup = {

        orientation:'landscape',

        fitToPage:true,

        fitToWidth:1,

        fitToHeight:0,

        paperSize:
          ws.PAPERSIZE_A4

      };


      ws.pageSetup.margins = {

        left:0.25,
        right:0.25,
        top:0.5,
        bottom:0.5,
        header:0.2,
        footer:0.2

      };


      widths.forEach(
        (w,i)=>{

          ws.getColumn(
            i+1
          ).width = w;

        }
      );


      /*
        AMBIL SEMUA KELAS
      */

      const classes = [

        ...new Set(
          list.map(
            x=>x.kodeKelas
          )
        )

      ].sort(
        (a,b)=>
          a.localeCompare(
            b,
            undefined,
            {
              numeric:true
            }
          )
      );


      let row = 1;


      /*
        SETIAP KELAS
      */

      classes.forEach(
        (code,classIndex)=>{

          const classRows =
            list.filter(
              x =>
                x.kodeKelas ===
                code
            );


          /*
            JUDUL KELAS
          */

          ws.mergeCells(
            row,
            1,
            row,
            8
          );


          const title =
            ws.getCell(
              row,
              1
            );


          title.value =
            `${reg.toUpperCase()} ${code}`;


          title.font = {

            name:'Arial',

            size:16,

            bold:true

          };


          title.alignment = {

            horizontal:'center',

            vertical:'middle'

          };


          title.fill = {

            type:'pattern',

            pattern:'solid',

            fgColor:{
              argb:'E2E8F0'
            }

          };


          title.border = {

            top:{
              style:'medium',
              color:{
                argb:'111827'
              }
            },

            left:{
              style:'medium',
              color:{
                argb:'111827'
              }
            },

            bottom:{
              style:'medium',
              color:{
                argb:'111827'
              }
            },

            right:{
              style:'medium',
              color:{
                argb:'111827'
              }
            }

          };


          ws.getRow(row).height =
            28;

          row++;


          /*
            SEMESTER
          */

          const semesterMatch =
            String(code)
              .match(/^(\d{2})/);


          const semester =
            semesterMatch
            ? parseInt(
                semesterMatch[1],
                10
              )
            : '';


          ws.mergeCells(
            row,
            1,
            row,
            8
          );


          const sub =
            ws.getCell(
              row,
              1
            );


          sub.value =
            semester
            ? `Semester ${semester} • ${classRows.length} mata kuliah`
            : `${classRows.length} mata kuliah`;


          sub.font = {

            name:'Arial',

            size:10,

            italic:true,

            color:{
              argb:'64748B'
            }

          };


          sub.alignment = {

            horizontal:'center',

            vertical:'middle'

          };


          ws.getRow(row).height =
            20;

          row++;


          /*
            DATA
          */

          const startTableRow =
            row;


          const values =
            classRows.map(
              (x,i)=>[

                i+1,

                x.mataKuliah,

                x.sks,

                x.ruang,

                x.hari,

                x.jamKe,

                x.waktu,

                teacherDisplay(
                  x.dosen
                )

              ]
            );


          /*
            TABLE EXCEL
          */

          ws.addTable({

            name:
              `T${reg.replace(/\W/g,'')}${classIndex+1}${Date.now()%100000}`,

            ref:
              `A${startTableRow}:H${startTableRow+values.length}`,

            headerRow:true,

            totalsRow:false,

            style:{

              theme:
                'TableStyleMedium2',

              showFirstColumn:false,

              showLastColumn:false,

              showRowStripes:true,

              showColumnStripes:false

            },

            columns:
              headers.map(
                h=>({
                  name:h
                })
              ),

            rows:
              values

          });


          /*
            HEADER
          */

          for(
            let c=1;
            c<=8;
            c++
          ){

            const cell =
              ws.getCell(
                startTableRow,
                c
              );


            cell.font = {

              name:'Arial',

              size:10,

              bold:true,

              color:{
                argb:'FFFFFF'
              }

            };


            cell.alignment = {

              horizontal:'center',

              vertical:'middle',

              wrapText:true

            };

          }


          /*
            DATA STYLE
          */

          for(
            let r=
              startTableRow+1;

            r<=
              startTableRow+
              values.length;

            r++
          ){

            for(
              let c=1;
              c<=8;
              c++
            ){

              const cell =
                ws.getCell(
                  r,
                  c
                );


              cell.font = {

                name:'Arial',

                size:10

              };


              cell.alignment = {

                vertical:'middle',

                wrapText:true

              };


              if(
                [1,3,6]
                  .includes(c)
              ){

                cell.alignment.horizontal =
                  'center';

              }

            }


            ws.getRow(r).height =
              22;

          }


          /*
            JARAK ANTAR TABEL
          */

          row =
            startTableRow +
            values.length +
            3;

        }
      );

    }


    /*
      NAMA FILE
    */

    const safeReg =
      regSelect.value==='ALL'

      ? 'SEMUA_REG'

      : regSelect.value
          .replace(/\s+/g,'_');


    const modePart =
      modeSelect.value==='dosen'

      ? 'DOSEN'

      : modeSelect.value==='all'

        ? 'SEMUA_KELAS'

        : (
            classSelect.value ||
            'KELAS'
          );


    const namePart =
      nameMode.value==='full'

      ? 'NAMA_LENGKAP'

      : 'NAMA_EXCEL';


    /*
      BUAT FILE
    */

    const buffer =
      await out.xlsx
        .writeBuffer();


    const blob =
      new Blob(
        [buffer],
        {
          type:
            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement(
        'a'
      );


    a.href = url;


    a.download =
      `Jadwal_${safeReg}_${modePart}_${namePart}.xlsx`;


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(
      url
    );


    classStatus.innerHTML =
      '<div class="success">' +
      'Excel berhasil dibuat ' +
      'dengan tabel terpisah per kelas.' +
      '</div>';


  }catch(err){

    console.error(err);


    classStatus.innerHTML =
      `<div class="error">
        Gagal membuat Excel:
        ${escapeHtml(
          err.message || err
        )}
      </div>`;

  }finally{

    downloadButton.disabled =
      false;

    downloadButton.textContent =
      'Download Excel';

  }

}


/* =========================================================
   UPLOAD EXCEL
   ========================================================= */

excelFile.addEventListener(
  'change',
  function(e){

    const file =
      e.target.files[0];


    if(!file){
      return;
    }


    fileStatus.innerHTML =
      '<div class="info">' +
      'Sedang membaca file Excel...' +
      '</div>';


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        try{

          workbook =
            XLSX.read(
              new Uint8Array(
                event.target.result
              ),
              {
                type:'array',
                cellDates:true
              }
            );


          loadAllData();


          const sheets =
            workbook.SheetNames
              .filter(
                s=>regFromSheet(s)
              );


          const countA =
            allRecords.filter(
              x=>x.reg==='Reg A'
            ).length;


          const countB =
            allRecords.filter(
              x=>x.reg==='Reg B'
            ).length;


          const countC =
            allRecords.filter(
              x=>x.reg==='Reg C'
            ).length;


          fileStatus.innerHTML = `

            <div class="success">

              File berhasil dibaca.

              Sheet jadwal:
              <b>
                ${sheets.join(', ')}
              </b>.

              Total
              <b>
                ${allRecords.length}
              </b>
              baris jadwal.

              <br>

              Reg A:
              <b>${countA}</b>

              •

              Reg B:
              <b>${countB}</b>

              •

              Reg C/CS:
              <b>${countC}</b>

            </div>

          `;


          showButton.disabled =
            false;


        }catch(err){

          console.error(err);


          fileStatus.innerHTML =
            '<div class="error">' +
            'File Excel gagal dibaca. ' +
            'Coba upload ulang file .xlsx.' +
            '</div>';

        }

      };


    reader.readAsArrayBuffer(
      file
    );

  }
);

/* =========================================================

showButton.addEventListener(
  'click',

);


downloadButton.addEventListener(
  'click',
