<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengolah Jadwal Prodi Akuntansi</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#111827;font-family:Arial,Helvetica,sans-serif}
.header{background:#111827;color:white;text-align:center;padding:32px 20px}
.header h1{margin:0 0 8px;font-size:34px}
.header p{margin:0;color:#d1d5db;font-size:17px}
.container{max-width:1500px;margin:28px auto;padding:0 18px}
.card,.table-card{background:#fff;border-radius:18px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
.card{padding:26px;margin-bottom:24px}
h2{margin:0 0 20px;font-size:25px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
label{display:block;font-weight:bold;margin-bottom:8px}
select,input[type=file]{width:100%;font-size:17px}
select{padding:14px;border:1px solid #d1d5db;border-radius:10px;background:white}
input[type=file]{padding:13px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
button{border:0;border-radius:10px;padding:15px 20px;font-size:17px;font-weight:bold;cursor:pointer;background:#111827;color:#fff}
button:hover{opacity:.92}
button:disabled{opacity:.45;cursor:not-allowed}
.download{background:#166534}
.success{background:#dcfce7;color:#166534;padding:14px;border-radius:10px;margin-top:16px}
.error{background:#fee2e2;color:#991b1b;padding:14px;border-radius:10px;margin-top:16px}
.info{background:#eff6ff;color:#1e40af;padding:14px;border-radius:10px;margin-top:16px}
.hint{color:#6b7280;margin-top:9px;font-size:14px}
.summary{font-weight:bold;font-size:20px;margin:8px 0 18px}
.table-card{padding:24px;margin-bottom:28px;overflow-x:auto}
.title{text-align:center;font-size:28px;font-weight:bold;margin-bottom:6px}
.subtitle{text-align:center;color:#6b7280;margin-bottom:20px}
table{width:100%;border-collapse:collapse;min-width:1050px}
th{background:#111827;color:white;padding:14px 10px;text-align:center;white-space:nowrap}
td{padding:12px 10px;border:1px solid #d1d5db;vertical-align:top}
.center{text-align:center}
.empty{padding:30px;text-align:center;color:#6b7280}
@media(max-width:900px){.grid,.actions{grid-template-columns:1fr}.header h1{font-size:27px}}
</style>
</head>
<body>

<div class="header">
  <h1>Pengolah Jadwal Prodi Akuntansi</h1>
  <p>1 kelas = 1 tabel • Semester otomatis dari kode kelas • Bisa download Excel</p>
</div>

<div class="container">

  <div class="card">
    <h2>1. Upload File Excel</h2>
    <input type="file" id="file" accept=".xlsx,.xls">
    <div id="fileStatus"></div>
    <div class="hint">Data dibaca langsung dari sheet Reg A, Reg B, dan Reg CS pada file Excel.</div>
  </div>

  <div class="card">
    <h2>2. Pilih Tampilan</h2>
    <div class="grid">
      <div>
        <label for="reg">Reguler</label>
        <select id="reg" disabled>
          <option value="">Upload Excel terlebih dahulu</option>
        </select>
      </div>
      <div>
        <label for="mode">Mode Tampilan</label>
        <select id="mode" disabled>
          <option value="single">Satu kelas</option>
          <option value="all">Semua kelas</option>
        </select>
      </div>
      <div>
        <label for="kelas">Kode Kelas</label>
        <select id="kelas" disabled>
          <option value="">Pilih kode kelas</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="show" disabled>Tampilkan Jadwal</button>
      <button id="download" class="download" disabled>Download Excel</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="hasil"></div>
</div>

<script>
let wb = null;
let classes = [];
let shown = [];

const fileEl = document.getElementById("file");
const fileStatus = document.getElementById("fileStatus");
const regEl = document.getElementById("reg");
const modeEl = document.getElementById("mode");
const kelasEl = document.getElementById("kelas");
const showEl = document.getElementById("show");
const downloadEl = document.getElementById("download");
const statusEl = document.getElementById("status");
const hasilEl = document.getElementById("hasil");

function clean(v){
  if(v === null || v === undefined) return "";
  return String(v).replace(/\s+/g," ").trim();
}

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeCode(v){
  return clean(v).replace(/\s+/g,"").toUpperCase();
}

/* Mendukung kode seperti:
   01AKSP001
   02 AKSM001
   03AKSP01
   05AKSP001 (PJK)
   termasuk jika ada typo huruf O pada bagian nomor. */
function parseClassCode(v){
  const s = clean(v);
  const m = s.match(/^(\d{2}\s*AKS[A-Z]{1,4}[A-Z0-9]{2,3})(?:\s*(\([^)]*\)))?$/i);
  if(!m) return null;
  const base = normalizeCode(m[1]);
  return base + (m[2] ? " " + clean(m[2]) : "");
}

function semesterFromCode(code){
  const m = normalizeCode(code).match(/^(\d{2})/);
  return m ? parseInt(m[1],10) : "";
}

function regName(reg){
  if(reg === "A") return "REGULER A";
  if(reg === "B") return "REGULER B";
  return "REGULER C";
}

function sheetForReg(reg){
  if(reg === "A") return "Reg A";
  if(reg === "B") return "Reg B";
  return "Reg CS";
}

function headerRowForSheet(sheet){
  const ws = wb.Sheets[sheet];
  if(!ws) return null;

  /* Cari baris yang paling banyak berisi kode kelas.
     Tidak lagi bergantung pada nomor baris yang kaku. */
  for(let r=0;r<Math.min(ws.length,15);r++){
    const row = ws[r] || [];
    let count = 0;
    for(const v of row){
      if(parseClassCode(v)) count++;
    }
    if(count >= 1) return r;
  }
  return null;
}

function findClassColumns(sheet){
  const ws = wb.Sheets[sheet];
  if(!ws) return [];

  const headerRow = headerRowForSheet(sheet);
  if(headerRow === null) return [];

  const row = ws[headerRow] || [];
  const found = [];
  const seen = new Set();

  for(let c=0;c<row.length;c++){
    const code = parseClassCode(row[c]);
    if(!code) continue;
    const key = normalizeCode(code);
    if(seen.has(key)) continue;
    seen.add(key);
    found.push({col:c, code, headerRow});
  }
  return found;
}

function getTimeMap(sheet){
  const ws = wb.Sheets[sheet];
  const map = {};
  if(!ws) return map;

  const timeRe = /^\d{1,2}\.\d{2}\s*-\s*\d{1,2}\.\d{2}$/;

  for(let r=0;r<ws.length;r++){
    const row = ws[r] || [];
    const b = clean(row[1]).toLowerCase();
    if(b !== "jam ke") continue;

    const jam = Number(row[2]);
    if(!Number.isFinite(jam)) continue;

    for(const v of row){
      const value = clean(v);
      if(timeRe.test(value)){
        map[String(jam)] = value;
        break;
      }
    }
  }
  return map;
}

function getScheduleEnd(sheet, headerRow){
  const ws = wb.Sheets[sheet];
  if(!ws) return headerRow;

  /* Berhenti sebelum NB. */
  for(let r=headerRow+1;r<ws.length;r++){
    const b = clean((ws[r]||[])[1]).toUpperCase();
    if(b === "NB") return r-1;
  }

  /* Fallback: cari baris terakhir yang masih punya jam 1-5 di kolom C. */
  let last = headerRow;
  for(let r=headerRow+1;r<ws.length;r++){
    const jam = Number((ws[r]||[])[2]);
    if(Number.isFinite(jam) && jam >= 1 && jam <= 5) last = r;
  }
  return last + 1;
}

function getSlotRows(sheet, headerRow, endRow){
  const ws = wb.Sheets[sheet];
  const slots = [];
  for(let r=headerRow+1;r<=endRow;r++){
    const jam = Number((ws[r]||[])[2]);
    if(Number.isFinite(jam) && jam >= 1 && jam <= 5){
      /* Hanya ambil baris pertama dari pasangan dosen -> mata kuliah. */
      const prev = slots[slots.length-1];
      if(!prev || prev.row !== r-1) slots.push({row:r,jam});
    }
  }
  return slots;
}

function getDayOrKeterangan(sheet, slotRow, isCS){
  const ws = wb.Sheets[sheet];
  if(!ws) return "";

  const labels = [];

  for(let r=0;r<ws.length;r++){
    const b = clean((ws[r]||[])[1]);
    if(!b) continue;

    if(isCS){
      if(/^CS\s*\(K\d+\)$/i.test(b)) labels.push({row:r,label:b});
    }else{
      const u = b.toUpperCase();
      if(["SENIN","SELASA","RABU","KAMIS","JUM'AT","JUMAT"].includes(u)){
        labels.push({
          row:r,
          label:u==="JUMAT" ? "Jum'at" : b.charAt(0).toUpperCase()+b.slice(1).toLowerCase()
        });
      }
    }
  }

  if(!labels.length) return "";

  let best = labels[0];
  let bestDist = Math.abs(slotRow - best.row);
  for(const x of labels.slice(1)){
    const d = Math.abs(slotRow - x.row);
    if(d < bestDist){
      best = x;
      bestDist = d;
    }
  }
  return best.label;
}

function getRoom(sheet, headerRow, classCol, row1, row2){
  const ws = wb.Sheets[sheet];
  const nextCol = classCol + 1;
  const header = clean((ws[headerRow]||[])[nextCol]).toLowerCase();

  if(header !== "ruangan" && header !== "ruang") return "";

  return clean((ws[row1]||[])[nextCol]) || clean((ws[row2]||[])[nextCol]);
}

function parseSheet(sheet, reg){
  const ws = wb.Sheets[sheet];
  if(!ws) return [];

  const classCols = findClassColumns(sheet);
  if(!classCols.length) return [];

  const headerRow = classCols[0].headerRow;
  const endRow = getScheduleEnd(sheet, headerRow);
  const slots = getSlotRows(sheet, headerRow, endRow);
  const times = getTimeMap(sheet);
  const isCS = sheet === "Reg CS";
  const result = [];

  for(const info of classCols){
    const data = [];
    let no = 1;

    for(const slot of slots){
      const r1 = slot.row;
      const r2 = r1 + 1;

      const teacher = clean((ws[r1]||[])[info.col]);
      const course = clean((ws[r2]||[])[info.col]);

      if(!course) continue;

      /* Jangan masukkan baris yang ternyata berisi jam. */
      if(/^\d{1,2}\.\d{2}\s*[-–]\s*\d{1,2}\.\d{2}$/.test(course)) continue;

      data.push({
        semester: semesterFromCode(info.code),
        no: no++,
        mataKuliah: course,
        sks: "",
        ruang: getRoom(sheet, headerRow, info.col, r1, r2),
        hari: getDayOrKeterangan(sheet, r1, isCS),
        waktu: times[String(slot.jam)] || "",
        dosen: teacher
      });
    }

    /* Kelas tetap boleh muncul jika ada kode, tetapi tabel hanya berisi
       jadwal yang memang terbaca dari sumber. */
    result.push({
      reg,
      code: info.code,
      semester: semesterFromCode(info.code),
      data
    });
  }

  return result;
}

function parseAll(){
  const out = [];
  for(const [sheet,reg] of [["Reg A","A"],["Reg B","B"],["Reg CS","CS"]]){
    out.push(...parseSheet(sheet,reg));
  }

  /* Hilangkan kode yang sama jika workbook memiliki duplikasi. */
  const seen = new Set();
  return out.filter(x=>{
    const key = x.reg + "|" + normalizeCode(x.code);
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  }).sort((a,b)=>{
    if(a.reg !== b.reg) return a.reg.localeCompare(b.reg);
    return normalizeCode(a.code).localeCompare(normalizeCode(b.code),undefined,{numeric:true});
  });
}

function fillControls(){
  const reg = regEl.value;
  const list = reg === "ALL" ? classes : classes.filter(x=>x.reg===reg);

  kelasEl.innerHTML = "";

  const allOpt = document.createElement("option");
  allOpt.value = "";
  allOpt.textContent = "Semua kelas";
  kelasEl.appendChild(allOpt);

  for(const cls of list){
    const opt = document.createElement("option");
    opt.value = cls.reg + "|" + cls.code;
    opt.textContent = cls.code;
    kelasEl.appendChild(opt);
  }

  const single = modeEl.value === "single";
  kelasEl.disabled = !single || list.length === 0;
  showEl.disabled = list.length === 0;

  if(single){
    kelasEl.value = list.length ? "" : "";
  }else{
    kelasEl.value = "";
  }

  statusEl.innerHTML = `<div class="info"><b>${list.length} kelas</b> tersedia untuk pilihan ini.</div>`;
}

function tableHTML(cls){
  let h = `
  <div class="table-card">
    <div class="title">${esc(regName(cls.reg))} ${esc(cls.code)}</div>
    <div class="subtitle">Semester ${esc(cls.semester)} • ${cls.data.length} mata kuliah terbaca</div>`;

  if(!cls.data.length){
    h += `<div class="empty">Tidak ada jadwal mata kuliah yang terbaca untuk kelas ini.</div></div>`;
    return h;
  }

  h += `
    <table>
      <thead>
        <tr>
          <th>SEMESTER</th>
          <th>NO</th>
          <th>MATA KULIAH</th>
          <th>SKS</th>
          <th>RUANG</th>
          <th>HARI</th>
          <th>WAKTU</th>
          <th>DOSEN PENGAMPU</th>
        </tr>
      </thead>
      <tbody>`;

  for(const r of cls.data){
    h += `<tr>
      <td class="center">${esc(r.semester)}</td>
      <td class="center">${esc(r.no)}</td>
      <td>${esc(r.mataKuliah)}</td>
      <td class="center">${esc(r.sks)}</td>
      <td>${esc(r.ruang)}</td>
      <td>${esc(r.hari)}</td>
      <td>${esc(r.waktu)}</td>
      <td>${esc(r.dosen)}</td>
    </tr>`;
  }

  return h + `</tbody></table></div>`;
}

function show(){
  const reg = regEl.value;
  const mode = modeEl.value;
  const key = kelasEl.value;

  let list = reg === "ALL" ? classes : classes.filter(x=>x.reg===reg);

  if(mode === "single"){
    if(!key){
      statusEl.innerHTML = `<div class="error">Pilih satu kode kelas dulu.</div>`;
      return;
    }
    const [r,c] = key.split("|");
    shown = classes.filter(x=>x.reg===r && x.code===c);
  }else{
    shown = list;
  }

  if(!shown.length){
    statusEl.innerHTML = `<div class="error">Data tidak ditemukan.</div>`;
    hasilEl.innerHTML = "";
    downloadEl.disabled = true;
    return;
  }

  const total = shown.reduce((n,x)=>n+x.data.length,0);

  statusEl.innerHTML = `
    <div class="success">
      <b>${shown.length} kelas</b> ditampilkan sebagai <b>${shown.length} tabel terpisah</b>.
      Total <b>${total}</b> mata kuliah terbaca.
    </div>`;

  hasilEl.innerHTML = `<div class="summary">Hasil Jadwal</div>` +
    shown.map(tableHTML).join("");

  downloadEl.disabled = false;
  window.scrollTo({top:hasilEl.offsetTop-20,behavior:"smooth"});
}

function safeSheetName(name,used){
  let base = name.replace(/[\\\/\?\*\[\]:]/g," ").slice(0,31).trim() || "Kelas";
  let out = base;
  let n = 2;
  while(used.has(out)){
    const suffix = " (" + n++ + ")";
    out = base.slice(0,31-suffix.length) + suffix;
  }
  used.add(out);
  return out;
}

function download(){
  if(!shown.length) return;

  const out = XLSX.utils.book_new();
  const used = new Set();

  for(const cls of shown){
    const rows = [
      [`${regName(cls.reg)} ${cls.code}`],
      ["SEMESTER","NO","MATA KULIAH","SKS","RUANG","HARI","WAKTU","DOSEN PENGAMPU"]
    ];

    for(const r of cls.data){
      rows.push([
        r.semester,
        r.no,
        r.mataKuliah,
        r.sks,
        r.ruang,
        r.hari,
        r.waktu,
        r.dosen
      ]);
    }

    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [
      {wch:12},{wch:7},{wch:34},{wch:8},
      {wch:15},{wch:18},{wch:20},{wch:30}
    ];

    XLSX.utils.book_append_sheet(
      out,
      ws,
      safeSheetName(`${regName(cls.reg)} ${cls.code}`,used)
    );
  }

  XLSX.writeFile(out,"Jadwal_Prodi_Akuntansi.xlsx");
}

fileEl.addEventListener("change",e=>{
  const file = e.target.files[0];
  if(!file) return;

  fileStatus.innerHTML = `<div class="info">Sedang membaca Excel...</div>`;

  const reader = new FileReader();

  reader.onload = ev=>{
    try{
      wb = XLSX.read(new Uint8Array(ev.target.result),{
        type:"array",
        cellDates:true
      });

      classes = parseAll();

      regEl.innerHTML = `
        <option value="ALL">Semua Reguler</option>
        <option value="A">Reg A</option>
        <option value="B">Reg B</option>
        <option value="CS">Reg C / CS</option>`;

      regEl.disabled = false;
      modeEl.disabled = false;
      modeEl.value = "all";
      regEl.value = "ALL";

      fillControls();

      const a = classes.filter(x=>x.reg==="A").length;
      const b = classes.filter(x=>x.reg==="B").length;
      const c = classes.filter(x=>x.reg==="CS").length;

      fileStatus.innerHTML = `
        <div class="success">
          File berhasil dibaca.
          Terdeteksi <b>${classes.length} kelas</b>:
          Reg A <b>${a}</b>,
          Reg B <b>${b}</b>,
          Reg C/CS <b>${c}</b>.
        </div>`;

      statusEl.innerHTML = `
        <div class="info">
          Pilih <b>Semua Reguler → Semua kelas</b> untuk menampilkan semua kelas.
          Setiap kelas akan dibuat menjadi <b>tabel sendiri</b>.
        </div>`;

    }catch(err){
      console.error(err);
      classes = [];
      fileStatus.innerHTML =
        `<div class="error">Gagal membaca Excel: ${esc(err.message)}</div>`;
    }
  };

  reader.readAsArrayBuffer(file);
});

regEl.addEventListener("change",fillControls);
modeEl.addEventListener("change",fillControls);
showEl.addEventListener("click",show);
downloadEl.addEventListener("click",download);
</script>
</body>
</html>
