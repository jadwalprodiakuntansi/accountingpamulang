<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pengolah Jadwal Prodi Akuntansi</title>

  <!-- Library untuk membaca Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fa;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 40px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .header p {
      margin: 0;
      color: #d1d5db;
      font-size: 18px;
    }

    .container {
      width: min(1400px, 94%);
      margin: 35px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
    }

    h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .upload-area {
      border: 2px dashed #b8bdc7;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
    }

    input[type="file"] {
      font-size: 16px;
      margin-bottom: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      margin-top: 20px;
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1f2937;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .result-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      background: #111827;
      color: white;
      padding: 15px 12px;
      border: 1px solid #d1d5db;
      text-align: center;
    }

    td {
      padding: 13px 12px;
      border: 1px solid #d1d5db;
      background: white;
    }

    td:first-child {
      text-align: center;
      width: 60px;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 30px;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 25px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Pengolah Jadwal Prodi Akuntansi</h1>
    <p>Otomatis mengolah data kelas, mata kuliah, dan dosen</p>
  </div>

  <div class="container">

    <!-- UPLOAD -->
    <div class="card">
      <h2>1. Upload File Excel</h2>

      <div class="upload-area">
        <input
          type="file"
          id="excelFile"
          accept=".xlsx,.xls"
        >

        <div id="uploadStatus"></div>
      </div>
    </div>

    <!-- PILIH KELAS -->
    <div class="card">

      <h2>2. Pilih Kelas</h2>

      <div class="form-grid">

        <div>
          <label for="sheetSelect">Program / Sheet</label>

          <select id="sheetSelect" disabled>
            <option value="">Upload Excel terlebih dahulu</option>
          </select>
        </div>

        <div>
          <label for="classSelect">Kode Kelas</label>

          <select id="classSelect" disabled>
            <option value="">Pilih kode kelas</option>
          </select>
        </div>

      </div>

      <button id="showButton" disabled>
        Tampilkan Jadwal
      </button>

      <div id="message"></div>

    </div>

    <!-- HASIL -->
    <div class="card" id="resultCard" style="display:none;">

      <div class="result-title">
        <h2 id="resultTitle"></h2>
      </div>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>NO</th>
              <th>MATA KULIAH</th>
              <th>SKS</th>
              <th>RUANG</th>
              <th>HARI</th>
              <th>WAKTU</th>
              <th>DOSEN PENGAMPU</th>
            </tr>
          </thead>

          <tbody id="resultBody"></tbody>

        </table>

      </div>

    </div>

  </div>


<script>

  let workbook = null;
  let currentData = {};
  let currentSheet = "";

  const excelFile = document.getElementById("excelFile");
  const sheetSelect = document.getElementById("sheetSelect");
  const classSelect = document.getElementById("classSelect");
  const showButton = document.getElementById("showButton");
  const uploadStatus = document.getElementById("uploadStatus");
  const message = document.getElementById("message");
  const resultCard = document.getElementById("resultCard");
  const resultTitle = document.getElementById("resultTitle");
  const resultBody = document.getElementById("resultBody");


  /*
   * ==========================================
   * 1. UPLOAD EXCEL
   * ==========================================
   */

  excelFile.addEventListener("change", async function(event) {

    const file = event.target.files[0];

    if (!file) return;

    try {

      uploadStatus.innerHTML =
        `<div class="success">Sedang membaca file...</div>`;

      const arrayBuffer = await file.arrayBuffer();

      workbook = XLSX.read(arrayBuffer, {
        type: "array"
      });

      /*
       * Kita hanya gunakan sheet jadwal.
       * Cek Dosen, Sheet1, dan Sheet4 tidak digunakan.
       */

      const allowedSheets = [
        "Reg A",
        "Reg B",
        "Reg CS"
      ];

      const availableSheets = workbook.SheetNames.filter(
        name => allowedSheets.includes(name)
      );

      if (availableSheets.length === 0) {

        uploadStatus.innerHTML =
          `<div class="error">
            Sheet Reg A / Reg B / Reg CS tidak ditemukan.
          </div>`;

        return;
      }

      /*
       * Masukkan sheet ke dropdown
       */

      sheetSelect.innerHTML =
        `<option value="">Pilih program</option>`;

      availableSheets.forEach(sheetName => {

        const option = document.createElement("option");

        option.value = sheetName;
        option.textContent = sheetName;

        sheetSelect.appendChild(option);

      });

      sheetSelect.disabled = false;

      uploadStatus.innerHTML =
        `<div class="success">
          File berhasil dibaca. Pilih program dan kode kelas.
        </div>`;

      /*
       * Reset
       */

      classSelect.innerHTML =
        `<option value="">Pilih kode kelas</option>`;

      classSelect.disabled = true;

      showButton.disabled = true;

      resultCard.style.display = "none";

    }

    catch (error) {

      console.error(error);

      uploadStatus.innerHTML =
        `<div class="error">
          File gagal dibaca.
        </div>`;

    }

  });


  /*
   * ==========================================
   * 2. CARI SEMUA KODE KELAS
   * ==========================================
   */

  sheetSelect.addEventListener("change", function() {

    const sheetName = this.value;

    if (!sheetName) {

      classSelect.disabled = true;
      showButton.disabled = true;

      return;
    }

    currentSheet = sheetName;

    const worksheet = workbook.Sheets[sheetName];

    /*
     * Ambil seluruh sheet sebagai array.
     */

    const data = XLSX.utils.sheet_to_json(
      worksheet,
      {
        header: 1,
        defval: ""
      }
    );

    currentData = {
      data: data,
      sheet: sheetName
    };

    /*
     * Cari kode kelas di seluruh sheet.
     *
     * Contoh:
     * 01AKSP001
     * 01AKSP002
     * 01AKSM001
     * 01AKSE001
     */

    const codes = [];

    data.forEach(row => {

      row.forEach(cell => {

        if (cell === null || cell === undefined) {
          return;
        }

        const text = String(cell).trim();

        /*
         * Format kode:
         * angka + AKS + huruf + angka
         */

        if (/^\d{2}\s?AKS[A-Z]\d{3}$/i.test(text)) {

          const cleanCode =
            text.replace(/\s+/g, "").toUpperCase();

          if (!codes.includes(cleanCode)) {
            codes.push(cleanCode);
          }

        }

      });

    });

    /*
     * Urutkan kode
     */

    codes.sort((a,b) =>
      a.localeCompare(b, undefined, {
        numeric: true
      })
    );

    /*
     * Masukkan ke dropdown
     */

    classSelect.innerHTML =
      `<option value="">Pilih kode kelas</option>`;

    codes.forEach(code => {

      const option = document.createElement("option");

      option.value = code;
      option.textContent = code;

      classSelect.appendChild(option);

    });

    classSelect.disabled = false;

    showButton.disabled = true;

    message.innerHTML =
      `<div class="success">
        ${codes.length} kode kelas ditemukan.
      </div>`;

  });


  /*
   * ==========================================
   * 3. AKTIFKAN TOMBOL
   * ==========================================
   */

  classSelect.addEventListener("change", function() {

    showButton.disabled = !this.value;

  });


  /*
   * ==========================================
   * 4. TAMPILKAN JADWAL
   * ==========================================
   */

  showButton.addEventListener("click", function() {

    const code = classSelect.value;

    if (!code) return;

    try {

      const jadwal = ambilDataKelas(
        currentData.data,
        code
      );

      if (jadwal.length === 0) {

        message.innerHTML =
          `<div class="error">
            Data mata kuliah untuk ${code} tidak ditemukan.
          </div>`;

        resultCard.style.display = "none";

        return;
      }

      tampilkanJadwal(
        code,
        jadwal
      );

      message.innerHTML =
        `<div class="success">
          ${jadwal.length} mata kuliah ditemukan untuk ${code}.
        </div>`;

    }

    catch (error) {

      console.error(error);

      message.innerHTML =
        `<div class="error">
          Terjadi kesalahan saat mengolah data.
          Silakan lihat Console untuk detail.
        </div>`;

    }

  });


  /*
   * ==========================================
   * 5. FUNGSI UTAMA MENGAMBIL DATA
   * ==========================================
   *
   * STRUKTUR FILE KAMU:
   *
   * DOSEN
   * MATA KULIAH
   * DOSEN
   * MATA KULIAH
   * DOSEN
   * MATA KULIAH
   *
   * Jadi kita TIDAK memisahkan daftar
   * dosen dan mata kuliah.
   *
   * Kita pertahankan urutan aslinya.
   *
   */

  function ambilDataKelas(data, targetCode) {

    let posisiKode = null;

    /*
     * Cari posisi kode kelas
     */

    for (let r = 0; r < data.length; r++) {

      for (let c = 0; c < data[r].length; c++) {

        const cell = String(
          data[r][c] ?? ""
        ).trim()
        .replace(/\s+/g, "")
        .toUpperCase();

        if (cell === targetCode) {

          posisiKode = {
            row: r,
            col: c
          };

          break;

        }

      }

      if (posisiKode) break;

    }

    if (!posisiKode) {
      return [];
    }

    const col = posisiKode.col;
    const startRow = posisiKode.row + 1;

    /*
     * Ambil seluruh isi kolom kode
     * setelah header kode.
     *
     * Kita sengaja TIDAK berhenti pada
     * baris kosong karena dalam file kamu
     * ada jeda/baris kosong.
     */

    const values = [];

    for (
      let r = startRow;
      r < data.length;
      r++
    ) {

      const value = data[r][col];

      if (
        value !== undefined &&
        value !== null &&
        String(value).trim() !== ""
      ) {

        const text =
          String(value).trim();

        /*
         * Kalau ketemu kode kelas lain,
         * berarti sudah masuk kolom/blok
         * kelas berikutnya.
         */

        const normalized =
          text.replace(/\s+/g, "")
              .toUpperCase();

        if (
          /^\d{2}AKS[A-Z]\d{3}$/.test(normalized) &&
          normalized !== targetCode
        ) {
          break;
        }

        /*
         * Abaikan tulisan DOSEN / MATAKULIAH
         */

        if (
          text.toUpperCase() ===
          "DOSEN / MATAKULIAH"
        ) {
          continue;
        }

        values.push(text);

      }

    }


    /*
     * Sekarang values bentuknya:
     *
     * [
     *   EUIS,
     *   MATEMATIKA,
     *   INRINOFITA,
     *   PANCASILA,
     *   YULI,
     *   AGAMA,
     *   ...
     * ]
     *
     * Jadi pasangan:
     *
     * index 0 = DOSEN
     * index 1 = MATA KULIAH
     *
     * index 2 = DOSEN
     * index 3 = MATA KULIAH
     *
     */

    const hasil = [];

    for (
      let i = 0;
      i + 1 < values.length;
      i += 2
    ) {

      const dosen = values[i];
      const mataKuliah = values[i + 1];

      /*
       * Jangan masukkan data aneh
       */

      if (
        !dosen ||
        !mataKuliah
      ) {
        continue;
      }

      /*
       * Hindari header / tulisan yang bukan
       * data mata kuliah.
       */

      if (
        mataKuliah.toUpperCase()
          .includes("DOSEN / MATAKULIAH")
      ) {
        continue;
      }

      hasil.push({

        mataKuliah: mataKuliah,

        dosen: dosen,

        sks: "",

        ruang: "",

        hari: "",

        waktu: ""

      });

    }

    /*
     * Hapus duplikat yang benar-benar identik
     */

    const unik = [];

    hasil.forEach(item => {

      const sudahAda = unik.some(x =>
        x.mataKuliah.toUpperCase() ===
          item.mataKuliah.toUpperCase()
        &&
        x.dosen.toUpperCase() ===
          item.dosen.toUpperCase()
      );

      if (!sudahAda) {
        unik.push(item);
      }

    });

    return unik;

  }


  /*
   * ==========================================
   * 6. TAMPILKAN HASIL
   * ==========================================
   */

  function tampilkanJadwal(code, jadwal) {

    resultTitle.textContent =
      `${currentSheet.toUpperCase()} ${code}`;

    resultBody.innerHTML = "";

    jadwal.forEach((item, index) => {

      const tr =
        document.createElement("tr");

      tr.innerHTML = `

        <td>${index + 1}</td>

        <td>${escapeHTML(item.mataKuliah)}</td>

        <td>${escapeHTML(item.sks)}</td>

        <td>${escapeHTML(item.ruang)}</td>

        <td>${escapeHTML(item.hari)}</td>

        <td>${escapeHTML(item.waktu)}</td>

        <td>${escapeHTML(item.dosen)}</td>

      `;

      resultBody.appendChild(tr);

    });

    resultCard.style.display = "block";

    /*
     * Scroll ke hasil
     */

    resultCard.scrollIntoView({
      behavior: "smooth"
    });

  }


  /*
   * ==========================================
   * 7. AMANKAN TEKS
   * ==========================================
   */

  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }

</script>

</body>
</html>
